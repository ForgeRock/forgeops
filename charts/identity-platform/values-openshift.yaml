# values-openshift.yaml — ForgeOps on OpenShift (namespace-range pattern), FC4b/FC5.
#
# WHAT THIS FILE IS: the reference deltas for an OpenShift deployment. The
# chart's platform.openshift.enabled flag applies the tested exposure posture
# (Routes, NetworkPolicies, the AM https port) from one key — this file shows
# everything THAT DOES NOT follow the flag, every delta annotated with its
# reason. Live-proven end-to-end 2026-11-04/05 (full platform Ready, Routes
# serving, user journey passing under a default-deny NetworkPolicy with the
# chart's NetworkPolicy templates enabled).
#
# HOW IT'S CONSUMED: the `forgeops env` command merges SPECIFIC values files
# (values-small/medium/large.yaml, values-secret-agent.yaml,
# values-helm-generate-secrets.yaml) with your environment settings into
# helm/<ENV_NAME>/values.yaml, and that merged file is what deploys. THIS
# FILE IS NOT YET ONE OF THEM — env does not read values-openshift.yaml
# until the --openshift-enable/--openshift-disable flag lands (see STORAGE
# CLASSES / TRACKING below). Until then the equivalent manual step is copying
# these keys into your environment's values file (helm/<ENV_NAME>/values.yaml)
# and redeploying with the standard forgeops flow — do NOT hand-assemble a
# multi-file -f chain for a real deployment.
#
# WHAT platform.openshift.enabled: true APPLIES (set it once; these keys stay
# untouched in this file because the mode owns them):
#   - platform.route.enabled: true           — chart-rendered edge Routes (FC2e)
#   - platform.networkPolicy.enabled: true   — the four tested netpol policies
#   - am.service.httpsPort: 81               — Route port-name resolution (FC2d)
# Any of the three can still be overridden explicitly (e.g. route.enabled:
# false under the mode renders no Routes). On non-OpenShift clusters the
# flag stays false and none of this fires.
#
# WHAT THIS FILE CHANGES VS CHART DEFAULTS (and why):
# 1. platform.openshift.enabled: true       — the mode flag itself (applies the
#                                             three keys above)
# 2. platform.ingress.enabled: false        — exposure is Routes, not Ingress
#                                             (NOT mode-owned: routes-vs-ingress
#                                             is a per-deployer exposure choice;
#                                             see the values.yaml openshift block)
# 3. platform.ingress.hosts[0]              — YOUR platform FQDN (see FQDN below)
# 4. platform.disable_secret_agent_config: true — no operator; secret prefill instead
# 5. platform.secrets_enabled: true          — chart default is false; the prefill
#                                             model above requires chart-rendered
#                                             Secrets for the prefilled material
# 6. ds_*.volumeClaimSpec.storageClassName  — set YOUR cluster's storage class
# 7. ds_set_passwords: null securityContexts — see SECURITY-CONTEXT NOTE below
#
# SECRETS ARE NOT IN THIS FILE: secret material belongs to
# the chart's generation path, never in a values file — generate passwords and
# keypairs before first install and pass them as prefill, per
# values-helm-generate-secrets.yaml and the forgeops env command. The
# PASSWORD RULE below still applies to whatever generates them.
#
# NAMESPACE PREREQUISITE (before first install — the pattern's foundation):
#   oc new-project forgeops
#   oc annotate namespace forgeops \
#     openshift.io/sa.scc.uid-range=11111/1 \
#     openshift.io/sa.scc.supplemental-groups=0/1 --overwrite
#   oc get namespace forgeops -o jsonpath='{.metadata.annotations.openshift\.io/sa\.scc\.uid-range}'
#   # must print 11111/1 (verify; a plain annotate fails silently without --overwrite)
# Support-status note: post-hoc annotation of a project OpenShift created is a
# documented-but-not-explicitly-supported mutation; baking the same annotations
# into a custom project template is the supported-by-construction form. Choose
# per your security team's posture and record which variant you used.
#
# PASSWORD RULE (live-proven gotcha): the DEFAULT image line's PingDS ships an
# enabled common-password dictionary validator (32k words, substring match).
# Generate REAL random passwords: mixed case + digits, >= 16 chars, nothing
# word-like. "abcdef", "0123456789", "abc123" and dictionary-containing
# patterns are REJECTED at the ds-set-passwords step with a Constraint
# Violation. Example generator:
#   openssl rand -base64 24 | tr -d '/+=' | cut -c1-20
#
# AMSTER KEYPAIR (live-proven gotcha): ssh-keygen -t rsa -b 2048 -m PEM.
# OpenSSL PKCS#8 keys fail amster's BouncyCastle parse.
#
# FQDN (decide BEFORE first install — expensive to change later):
# platform.ingress.hosts[0] below is THE platform FQDN. All chart-rendered
# Routes use it as their hostname; AM FQDN-validates OAuth2 requests, so a
# Route under any other hostname returns 400 "FQDN ... is not valid".
#
# CERTIFICATES: cert-manager is enabled by default in this chart; it must be
# installed on the cluster BEFORE the platform (the chart's DS certificates are
# minted by pre-install hooks that fire only at install time):
#   helm repo add jetstack https://charts.jetstack.io
#   helm install cert-manager jetstack/cert-manager -n cert-manager \
#     --create-namespace --set crds.enabled=true
#
# STORAGE CLASSES: the intended home for these two keys is flags on the
# `forgeops env` command (--idrepo-storage-class, --cts-storage-class) plus
# an --openshift-enable/--openshift-disable pair that sets
# platform.openshift.enabled and merges this file's deltas into the
# environment; those flags are a separate change from chart templates and
# are not built here. Until they land, edit the two storageClassName values
# below by hand. (Tracking: this file's PR records the deferral; the flags
# land in the forgeops CLI's env-command surface, not in this chart.)
#
# BRING-UP (fresh project, cert-manager present): bring-up runs through the
# standard forgeops flow with these deltas merged into your environment's
# values (see HOW IT'S CONSUMED above) plus the generated-secrets file —
# without the generated secrets the workloads reference Secrets nothing
# creates and pods sit in CreateContainerConfigError.
# Expected: ~8-15 min to all-Ready. If helm reports an amster hook timeout,
# the resources ARE installed — let workloads converge, then re-run
# `helm upgrade` with the same values to settle release state. Do NOT
# uninstall on a hook timeout.

platform:
  openshift:
    enabled: true             # FC5: applies route.enabled + networkPolicy.enabled
                              # + am.service.httpsPort: 81 (override any of the
                              # three explicitly if you need something else)

  ingress:
    enabled: false            # exposure is Routes (the mode applies them), not
                              # nginx Ingress
    hosts:
      - identity-platform.apps-crc.testing   # <- YOUR platform FQDN (see above)

  disable_secret_agent_config: true
  secrets_enabled: true

# Storage class: the chart default ("fast") rarely exists. StatefulSet
# volumeClaimTemplates are IMMUTABLE — a wrong class means uninstall/reinstall,
# so set this BEFORE the first install to YOUR cluster's storage class.
ds_idrepo:
  volumeClaimSpec:
    storageClassName: crc-csi-hostpath-provisioner   # <- YOUR storage class
ds_cts:
  volumeClaimSpec:
    storageClassName: crc-csi-hostpath-provisioner   # <- YOUR storage class

# SECURITY-CONTEXT NOTE: nulls the security contexts of the ds-set-passwords
# JOB ONLY — the DS StatefulSets keep their stock security contexts. The
# job's stock pod pins runAsUser: 0, which restricted-v2 rejects under this
# pattern's namespace UID range. Pinning the job to 11111 instead was
# evaluated and rejected: the stock entrypoints write password material
# owned by root, so a UID-pinned run risks a mid-upgrade permission failure
# for no security gain (short-lived in-cluster job, no external surface;
# the injected namespace UID governs it — validated 2026-11-04/05).
ds_set_passwords:
  podSecurityContext: null
  securityContext: null

# IMAGE LINE: under this namespace-pinning pattern the DEFAULT image line
# works as-is (validated). To use the alpine line instead (only needed for
# the stricter native-conformance shape), uncomment:
# platform:
#   imageRepository: us-docker.pkg.dev/forgeops-public/images/alpine
#   imageMode: forgeops
# (note the alpine UI spelling difference: enduser-ui vs end-user-ui)
