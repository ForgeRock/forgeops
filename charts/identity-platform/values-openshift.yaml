# values-openshift.yaml — ForgeOps on OpenShift (namespace-range pattern), FC4b.
#
# DELTAS-ONLY FILE: every key below differs from chart defaults and carries the
# reason; anything not mentioned here stays stock. Keys equal to defaults were
# removed — this file contains changes from the default, not
# a restatement of it. Live-proven end-to-end 2026-11-04/05 (full platform Ready,
# Routes serving, user journey passing under a default-deny NetworkPolicy with
# this chart's own NetworkPolicy templates enabled).
#
# WHAT THIS FILE CHANGES VS CHART DEFAULTS (and why):
# 1. platform.ingress.enabled: false        — exposure is Routes, not Ingress
# 2. platform.route.enabled: true           — chart-rendered edge Routes (FC2e);
#                                             am/idm names, termination, and the
#                                             UI route gates keep their defaults
# 3. platform.networkPolicy.enabled: true   — the four tested netpol policies (FC2e)
# 4. am.service.httpsPort: 81               — Route port-name resolution (FC2d)
# 5. platform.disable_secret_agent_config: true — no operator; secret prefill instead
# 6. ds_*.volumeClaimSpec.storageClassName  — set YOUR cluster's storage class
# 7. ds_set_passwords: null securityContexts — see SECURITY-CONTEXT NOTE below
#
# SECRETS ARE NOT IN THIS FILE: secret material belongs to
# the chart's generation path, never in a values file — generate passwords and
# keypairs before first install and pass them as prefill, per
# values-helm-generated-secrets.yaml and the forgeops env command. The
# PASSWORD RULE below still applies to whatever generates them.
#
# NAMESPACE PREREQUISITE (before first install — the pattern's foundation):
#   oc new-project forgeops
#   oc annotate namespace forgeops \
#     openshift.io/sa.scc.uid-range=11111/1 \
#     openshift.io/sa.scc.supplemental-groups=0/1 --overwrite
#   oc get namespace forgeops -o jsonpath='{.metadata.annotations.openshift\.io/sa\.scc\.uid-range}'
#   # must print 11111/1 (verify; a plain annotate fails silently without --overwrite)
# Support-status note: post-hoc annotation of a project OpenShift created is a
# documented-but-not-explicitly-supported mutation; baking the same annotations
# into a custom project template is the supported-by-construction form. Choose
# per your security team's posture and record which variant you used.
#
# PASSWORD RULE (live-proven gotcha): the DEFAULT image line's PingDS ships an
# enabled common-password dictionary validator (32k words, substring match).
# Generate REAL random passwords: mixed case + digits, >= 16 chars, nothing
# word-like. "abcdef", "0123456789", "abc123" and dictionary-containing
# patterns are REJECTED at the ds-set-passwords step with a Constraint
# Violation. Example generator:
#   openssl rand -base64 24 | tr -d '/+=' | cut -c1-20
#
# AMSTER KEYPAIR (live-proven gotcha): ssh-keygen -t rsa -b 2048 -m PEM.
# OpenSSL PKCS#8 keys fail amster's BouncyCastle parse.
#
# FQDN (decide BEFORE first install — expensive to change later):
# platform.ingress.hosts[0] below is THE platform FQDN. All chart-rendered
# Routes use it as their hostname; AM FQDN-validates OAuth2 requests, so a
# Route under any other hostname returns 400 "FQDN ... is not valid".
#
# CERTIFICATES: cert-manager is enabled by default in this chart; it must be
# installed on the cluster BEFORE the platform (the chart's DS certificates are
# minted by pre-install hooks that fire only at install time):
#   helm repo add jetstack https://charts.jetstack.io
#   helm install cert-manager jetstack/cert-manager -n cert-manager \
#     --create-namespace --set crds.enabled=true
#
# STORAGE CLASSES: the intended home for these two keys is flags on the
# `forgeops env` command (--idrepo-storage-class, --cts-storage-class) plus
# an --openshift-enable/--openshift-disable pair that consumes this file;
# those flags are a separate change from chart templates and are not built
# here. Until they land, edit the two storageClassName values below by hand.
# (Tracking: this file's PR records the deferral; the flags land in the
# forgeops CLI repo's env-command surface, not in this chart.)
#
# BRING-UP (fresh project, cert-manager present, this file adapted):
#   helm install identity-platform <chart-dir> -n forgeops \
#     -f values-openshift.yaml --timeout 15m
# Expected: ~8-15 min to all-Ready. If helm reports an amster hook timeout,
# the resources ARE installed — let workloads converge, then re-run
# `helm upgrade` with the same values to settle release state. Do NOT
# uninstall on a hook timeout.

platform:
  ingress:
    enabled: false            # exposure is Routes (below), not nginx Ingress
    hosts:
      - identity-platform.apps-crc.testing   # <- YOUR platform FQDN (see above)

  route:
    enabled: true             # FC2e: chart-rendered OpenShift Routes (edge).
                              # AM termination STAYS edge (the default): AM's
                              # 8081 is plain HTTP behind Tomcat's TLS-offload
                              # connector — reencrypt Routes 503 and
                              # passthrough fails the TLS handshake. Security
                              # teams mandating reencrypt need an AM
                              # TLS-enabled image first.

  networkPolicy:
    enabled: true             # FC2e: the four tested policies; coexists with
                              # a default-deny-all policy in the namespace.
                              # Includes kubeapi egress for the chart's own
                              # kubectl-sidecar jobs (keystore-create, amster).

  disable_secret_agent_config: true
  secrets_enabled: true

# Storage class: the chart default ("fast") rarely exists. StatefulSet
# volumeClaimTemplates are IMMUTABLE — a wrong class means uninstall/reinstall,
# so set this BEFORE the first install to YOUR cluster's storage class.
ds_idrepo:
  volumeClaimSpec:
    storageClassName: crc-csi-hostpath-provisioner   # <- YOUR storage class
ds_cts:
  volumeClaimSpec:
    storageClassName: crc-csi-hostpath-provisioner   # <- YOUR storage class

# SECURITY-CONTEXT NOTE (answers review "disabling all security on DS is a
# bad idea"): this nulls the security contexts of the ds-set-passwords
# JOB ONLY — the DS StatefulSets keep their stock security contexts untouched.
# The job's stock pod pins runAsUser: 0, which can never sit inside a namespace
# UID range that keeps 11111 usable; restricted-v2 rejects it under any
# configuration of this pattern. The obvious alternative — pinning the job's
# runAsUser to 11111 (the UID the namespace grants) — was evaluated and
# rejected: the job writes amster/DS password material owned by root in the
# stock image entrypoints, and a UID-pinned run risks a permission failure
# mid-upgrade for no security gain (the job runs seconds, inside the cluster,
# with no external surface; nulling the context lets OpenShift's injected UID
# govern it instead — validated end-to-end 2026-11-04/05). This is a
# deliberate, documented trade scoped to one short-lived init job, not a
# blanket security disable.
ds_set_passwords:
  podSecurityContext: null
  securityContext: null

# Route targetPort resolution (FC2d): the second Service port literally NAMED
# "https" is what the chart-rendered AM Route resolves against. Without it the
# Route falls back to the "http" port (still functional chart-side, but the
# live-proven 503 root cause and fix pair is Route + this named port).
am:
  service:
    httpsPort: 81

# IMAGE LINE: under this namespace-pinning pattern the DEFAULT image line
# works as-is (validated). To use the alpine line instead (only needed for
# the stricter native-conformance shape), uncomment:
# platform:
#   imageRepository: us-docker.pkg.dev/forgeops-public/images/alpine
#   imageMode: forgeops
# (note the alpine UI spelling difference: enduser-ui vs end-user-ui)
