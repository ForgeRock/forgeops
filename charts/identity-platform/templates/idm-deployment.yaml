{{- if .Values.idm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idm
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with .Values.idm.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.idm.autoscaling.enabled }}
  replicas: {{ .Values.idm.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "identity-platform.selectorLabels" . | nindent 6 }}
      {{- with .Values.idm.podLabels }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
  template:
    metadata:
      annotations:
        {{- if .Values.platform.annotations.deploymentDate.enabled }}
        deployment-date: {{ now | quote }}
        {{- end }}
        {{- with .Values.idm.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "identity-platform.selectorLabels" . | nindent 8 }}
        {{- with .Values.idm.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.idm.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.idm.image.imagePullSecrets | nindent 8 }}
      {{- else if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "identity-platform.serviceAccountName" . }}
      securityContext:
        {{- $psc := deepCopy (.Values.idm.podSecurityContext | default dict) }}
        {{- /* Only force runAsUser when the deployer's podSecurityContext actually
             carries one: int(nil) is 0 and a wholesale override without
             runAsUser would otherwise render runAsUser: 0 (root). */}}
        {{- if kindIs "invalid" (index $psc "runAsUser") | not }}
        {{- $_ := set $psc "runAsUser" (include "platform.runAsUser" (list (index $psc "runAsUser") .) | int) }}
        {{- end }}
        {{- toYaml $psc | nindent 8 }}
      volumes:
        - name: custom
          emptyDir: {}
        - name: fbc
          emptyDir: {}
        - name: writeable
          emptyDir: {}
        - name: idm-secrets
          secret:
            {{- if eq (include "keystore_create.resources.enabled" .) "true" }}
            secretName: keystore
            {{- else }}
            secretName: idm
            {{- end }}
        - name: truststore
          projected:
            sources:
              - secret:
                  name: ds-ssl-keypair
              {{- if .Values.platform.truststore.secret.enabled }}
              - secret:
                  name: {{ .Values.platform.truststore.secret.name }}
                  optional: true
              {{- end }}
        {{- if .Values.platform.rcs.enabled }}
        # Shared RCS password, created by the charts/rcs release in this
        # namespace. Optional: without it (no rcs release) the filesystem-init
        # RCS wiring is a no-op. RCS_KEY_PASSWORD is the plaintext shared
        # password; the RCS side derives its key-hash form from it.
        - name: rcs-key
          secret:
            secretName: rcs-key
            optional: true
        {{- end }}
        - name: new-truststore
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: audit-logs
          emptyDir: {}
        - name: idm-logback-xml
          configMap:
            name: idm-logback-xml
        - name: idm-logging-properties
          configMap:
            name: idm-logging-properties
        - name: idm-import-pem-certs
          configMap:
            name: idm-import-pem-certs
            defaultMode: 0755
        - name: idm-init-scripts
          configMap:
            name: idm-init-scripts
            defaultMode: 0755
      initContainers:
        - name: custom-vol-init
          image: "{{ .Values.idm_custom.image.repository }}:{{ .Values.idm_custom.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.idm_custom.image.pullPolicy }}
          volumeMounts:
          - mountPath: /custom
            name: custom
          - mountPath: /scripts
            name: idm-init-scripts
          command: [/scripts/custom-vol-init.sh]
        - name: filesystem-init
          image: {{ include "platform.imageRef" (list . (list .Values.idm.image "idm" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.idm.image.pullPolicy }}
          env:
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          {{- if eq (.Values.platform.imageMode | default "base") "forgeops" }}
          # The pingidm single-mode image ships the deployment conf as an
          # unapplied CONFIG_PROFILE overlay; filesystem-init applies it
          # onto the fbc conf when the runtime mode is forgeops.
          - name: IMAGE_MODE
            value: forgeops
          - name: CONFIG_PROFILE
            value: cdk-base
          {{- end }}
          {{- if .Values.platform.rcs.enabled }}
          # Out-of-the-box RCS wiring: register the RCS with IDM's connector
          # info provider when the rcs-key secret (charts/rcs release) is
          # present; a no-op otherwise (see filesystem-init.sh).
          - name: RCS_CONNECTOR_SERVER_ENABLED
            value: "true"
          - name: RCS_CONNECTOR_SERVER_NAME
            value: {{ .Values.platform.rcs.name | quote }}
          {{- if .Values.platform.rcs.host }}
          - name: RCS_CONNECTOR_SERVER_HOST
            value: {{ .Values.platform.rcs.host | quote }}
          {{- end }}
          - name: RCS_CONNECTOR_SERVER_PORT
            value: {{ .Values.platform.rcs.port | quote }}
          - name: RCS_CONNECTOR_SERVER_USE_SSL
            value: {{ .Values.platform.rcs.useSSL | quote }}
          {{- if .Values.platform.rcs.provisioner.enabled }}
          - name: RCS_CONNECTOR_SERVER_PROVISIONER_ENABLED
            value: "true"
          - name: RCS_CONNECTOR_SERVER_PROVISIONER_NAME
            value: {{ .Values.platform.rcs.provisioner.name | quote }}
          {{- with .Values.platform.rcs.provisioner.host }}
          - name: RCS_CONNECTOR_SERVER_PROVISIONER_HOST
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.platform.rcs.provisioner.port }}
          - name: RCS_CONNECTOR_SERVER_PROVISIONER_PORT
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.platform.rcs.provisioner.base }}
          - name: RCS_CONNECTOR_SERVER_PROVISIONER_BASE
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.platform.rcs.provisioner.user }}
          - name: RCS_CONNECTOR_SERVER_PROVISIONER_USER
            value: {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- end }}
          volumeMounts:
          - mountPath: /fbc
            name: fbc
          - mountPath: /custom
            name: custom
          - mountPath: /writeable
            name: writeable
          - mountPath: /scripts
            name: idm-init-scripts
          {{- if .Values.platform.rcs.enabled }}
          - mountPath: /rcs-secrets
            name: rcs-key
            readOnly: true
          {{- end }}
          command: [/scripts/filesystem-init.sh]
        - name: truststore-init
          image: {{ include "platform.imageRef" (list . (list .Values.idm.image "idm" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.idm.image.pullPolicy }}
          volumeMounts:
          - name: new-truststore
            mountPath: /truststore
          - name: truststore
            mountPath: /var/run/secrets/truststore
          - name: idm-import-pem-certs
            mountPath: /opt/openidm/bin/import-pem-certs.sh
            subPath: import-pem-certs.sh
          command:
            - /opt/openidm/bin/import-pem-certs.sh
          env:
          - name: TRUSTSTORE_PATH
            value: /truststore/idmtruststore
          - name: TRUSTSTORE_PASSWORD
            value: changeit
          {{- if eq (.Values.platform.imageMode | default "base") "forgeops" }}
          # Alpine CA bundle path (the Debian image uses /usr/lib/ssl/cert.pem)
          - name: IDM_PEM_TRUSTSTORE
            value: /etc/ssl/certs/ca-certificates.crt
          - name: IMAGE_MODE
            value: forgeops
          {{- else }}
          - name: IDM_PEM_TRUSTSTORE
            value: /usr/lib/ssl/cert.pem
          {{- end }}
          - name: IDM_PEM_TRUSTSTORE_DS
            value: /var/run/secrets/truststore/ca.crt
          {{- if .Values.platform.truststore.secret.enabled }}
          - name: IDM_PEM_TRUSTSTORE_EXTRA
            value: /var/run/secrets/truststore/{{ .Values.platform.truststore.secret.key }}
          {{- end }}
      containers:
        - name: openidm
          securityContext:
            {{- toYaml .Values.idm.securityContext | nindent 12 }}
          image: {{ include "platform.imageRef" (list . (list .Values.idm.image "idm" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.idm.image.pullPolicy }}
          env:
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          {{- if eq (.Values.platform.imageMode | default "base") "forgeops" }}
          - name: IMAGE_MODE
            value: forgeops
          {{- end }}
          - name: OPENIDM_REPO_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ds-passwords
                key: dirmanager.pw
          - name: USERSTORE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ds-passwords
                key: dirmanager.pw
          {{- if eq (include "keystore_create.resources.enabled" .) "true" }}
          - name: OPENIDM_KEYSTORE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keystore-create
                key: KEYSTORE_PASSWORD
          {{- else }}
          - name: OPENIDM_KEYSTORE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: idm-env-secrets
                key: OPENIDM_KEYSTORE_PASSWORD
          {{- end }}
          - name: OPENIDM_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: idm-env-secrets
                key: OPENIDM_ADMIN_PASSWORD
          - name: RS_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: amster-env-secrets
                key: IDM_RS_CLIENT_SECRET
          {{- with .Values.platform.env }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.idm.env }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          envFrom:
          - configMapRef:
              name: idm
          {{- with .Values.platform.envFrom }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.idm.envFrom }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /openidm/info/ping
              port: http
              httpHeaders:
                - name: X-OpenIDM-Username
                  value: anonymous
                - name: X-OpenIDM-Password
                  value: anonymous
                - name: X-OpenIDM-NoSession
                  value: "true"
            {{- with .Values.idm.livenessProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /openidm/info/ping
              port: http
              httpHeaders:
                - name: X-OpenIDM-Username
                  value: anonymous
                - name: X-OpenIDM-Password
                  value: anonymous
                - name: X-OpenIDM-NoSession
                  value: "true"
            {{- with .Values.idm.readinessProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /openidm/info/ping
              port: http
              httpHeaders:
                - name: X-OpenIDM-Username
                  value: anonymous
                - name: X-OpenIDM-Password
                  value: anonymous
                - name: X-OpenIDM-NoSession
                  value: "true"
            {{- with .Values.idm.startupProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.idm.resources | nindent 12 }}
          volumeMounts:
          - mountPath: /var/run/secrets/idm
            name: idm-secrets
          - name: writeable
            mountPath: /opt/openidm
            subPath: opt/openidm
          - name: new-truststore
            mountPath: /opt/openidm/idmtruststore
            readOnly: true
            subPath: idmtruststore
          - mountPath: /opt/openidm/logs
            name: logs
          - mountPath: /opt/openidm/audit
            name: audit-logs
          - mountPath: /var/run/openidm/logging/logback
            name: idm-logback-xml
          - mountPath: /var/run/openidm/logging
            name: idm-logging-properties
          - name: fbc
            mountPath: /opt/openidm/conf
            subPath: conf
          - name: fbc
            mountPath: /opt/openidm/ui
            subPath: ui
          - name: fbc
            mountPath: /opt/openidm/script
            subPath: script
          - name: writeable
            mountPath: /tmp
            subPath: tmp
      {{- with .Values.idm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.idm.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
      {{- if .Values.idm.tolerations }}
        {{- toYaml .Values.idm.tolerations | nindent 8 }}
      {{- else if .Values.platform.tolerations }}
        {{- toYaml .Values.platform.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
