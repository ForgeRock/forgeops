{{- if and (or .Release.IsInstall .Values.amster.force) .Values.amster.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: amster-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    {{- if .Values.amster.deleteOnSuccess }}
    "helm.sh/hook-delete-policy": "hook-succeeded,before-hook-creation"
    {{- end }}
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with .Values.amster.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.amster.backoffLimit }}
  {{- if .Values.amster.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.amster.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      annotations:
        {{- if .Values.platform.annotations.deploymentDate.enabled }}
        deployment-date: {{ now | quote }}
        {{- end }}
        {{- with .Values.amster.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "identity-platform.selectorLabels" . | nindent 8 }}
        {{- with .Values.amster.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: {{ .Values.amster.restartPolicy }}
      {{- if .Values.amster.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.amster.image.imagePullSecrets | nindent 8 }}
      {{- else if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "identity-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.amster.podSecurityContext | nindent 8 }}
      volumes:
        - name: amster-scripts
          configMap:
            name: amster-scripts
        - name: config
          configMap:
            name: amster-config
            optional: true
        - name: amster-secrets
          secret:
            secretName: amster
            items:
              - key: {{ include "amster.ssh.private_key_name" . | quote }}
                path: id_rsa
        - name: platform-config
          configMap:
            name: platform-config
        - name: export-files
          emptyDir: {}
      initContainers:
        - name: amster
          securityContext:
            {{- toYaml .Values.amster.securityContext | nindent 12 }}
          image: {{ include "platform.imageRef" (list . (list .Values.amster.image "amster" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.amster.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              {{- if eq (.Values.platform.imageMode | default "base") "forgeops" }}
              {{/* The pingamster single-mode image stages the deployment
                   assets (CONFIG_PROFILE overlay) unapplied at
                   /opt/amster-forgeops. The image entrypoint wrapper applies
                   them -- but this init container overrides the entrypoint
                   with its own command, so apply them here instead. The
                   staging path is the image's FIXED contract: CONFIG_PROFILE
                   selects WHICH profile the image stages at BUILD time (see
                   the pingamster Dockerfile COPY), so the runtime path never
                   varies and is not derived from the CONFIG_PROFILE env
                   below (that env exists for the image's own wrapper, which
                   standalone runs use). Amster images that predate the
                   staged-overlay refactor bake the profile DIRECTLY into
                   /opt/amster at build time (upstream docker/amster/
                   Dockerfile still does) -- those keep working through the
                   elif: their pre-baked config is imported as before, as is
                   any deployment that supplies an amster-import.tar.gz.
                   The chart cm scripts (copied after this block) are applied
                   last, so they win over anything the profile happens to
                   contain. The profile's client/agent passwords stay in
                   their &{...} env-substitution form (verified live: amster
                   resolves them at import from this container's env --
                   VERSION, FQDN via envFrom below, and the
                   amster-env-secrets values for the dotted secret names),
                   which is also the form bin/commands/amster writes back on
                   export. */}}
              {{/* Only the import cares about the guard: an export or
                   upload run has no use for staged import JSONs. The
                   amster-import.tar.gz ConfigMap is mounted OUTSIDE
                   /opt/amster (at /amster-import/) and copied in below,
                   AFTER the profile: subPath-mounting it INSIDE
                   /opt/amster/config made kubelet pre-create that parent
                   directory as root:root 0755 when the ConfigMap is
                   absent, and the runtime uid could then not write the
                   staged profile into it (observed 2026-10-09: the
                   profile cp failed with "Permission denied"; the uid is
                   the image's USER -- 9031 on the alpine pingamster
                   image, whatever the image ships otherwise). With the
                   mount out of the way, /opt/amster/config only ever
                   contains real importable content: pre-baked config from
                   older images, the staged profile, and/or the tarball
                   copied in below. NOTE the new precondition this creates:
                   importing now requires the runtime uid to be able to
                   create/write /opt/amster/config. It holds for the images
                   this chart deploys (the profile cp creates the dir
                   owned by the runtime uid; upstream docker/amster
                   chmods /opt/amster 777), but an externally-built image
                   with a root-owned config dir, or
                   readOnlyRootFilesystem: true, would fail the tarball
                   copy -- deliberately loudly, with the diagnostic
                   below. */}}
              case "${FUNCTION:-}" in
              ""|import)
                if [ -d /opt/amster-forgeops/profile/config ] && [ -n "$(ls -A /opt/amster-forgeops/profile/config 2>/dev/null)" ]; then
                  cp -r /opt/amster-forgeops/profile/. /opt/amster/ || {
                    echo "amster-job: failed to apply the staged config profile from /opt/amster-forgeops/profile" >&2
                    exit 1
                  }
                elif [ -n "$(find /opt/amster/config -mindepth 1 -print -quit 2>/dev/null)" ] || [ -f /amster-import/amster-import.tar.gz ]; then
                  echo "amster-job: the amster image stages no config profile; importing the /opt/amster/config content (pre-baked, and/or the amster-config tarball staged below)"
                else
                  echo "amster-job: nothing to import -- the amster image stages no config profile under /opt/amster-forgeops (found: $(ls -A /opt/amster-forgeops 2>/dev/null | tr '\n' ' ')) and /opt/amster/config is empty; refusing to run an import that would silently configure nothing" >&2
                  exit 1
                fi
                # The optional amster-config tarball lands AFTER the
                # profile so its content wins on path collisions,
                # matching what import.sh's in-place extraction did when
                # the ConfigMap was subPath-mounted inside
                # /opt/amster/config. Scoped to import runs: an export
                # neither needs nor writes the tarball, and staging it
                # would abort an export against a leftover ConfigMap on
                # an image whose /opt/amster/config is not writable.
                if [ -f /amster-import/amster-import.tar.gz ]; then
                  mkdir -p /opt/amster/config || {
                    echo "amster-job: could not create /opt/amster/config (runtime uid $(id -u) cannot write /opt/amster?)" >&2
                    exit 1
                  }
                  cp /amster-import/amster-import.tar.gz /opt/amster/config/ || {
                    echo "amster-job: failed to stage the amster-import.tar.gz ConfigMap content into /opt/amster/config (runtime uid $(id -u) cannot write it?)" >&2
                    exit 1
                  }
                fi
                ;;
              esac
              {{- end }}
              for f in $(find /amster-scripts); do
                cp -r $f /opt/amster/ && chmod 775 /opt/amster/$(basename $f) || {
                  echo "amster-job: failed to install the chart's amster script $f over the image's own" >&2
                  exit 1
                }
              done
              [ -z "$FUNCTION" ] && FUNCTION="import"
              ./docker-entrypoint.sh $FUNCTION
          env:
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          {{- if eq (.Values.platform.imageMode | default "base") "forgeops" }}
          # The pingamster single-mode image stages the deployment assets
          # (CONFIG_PROFILE overlay + forgeops scripts) unapplied at
          # /opt/amster-forgeops; the image entrypoint applies them only in
          # forgeops runtime mode.
          - name: IMAGE_MODE
            value: forgeops
          - name: CONFIG_PROFILE
            value: default
          {{- end }}
          envFrom:
          - configMapRef:
              name: platform-config
          - configMapRef:
              name: amster-function
              optional: true
          - secretRef:
              name: amster-env-secrets
          resources:
            {{- toYaml .Values.amster.resources | nindent 12 }}
          volumeMounts:
          {{/* Derive the script directory from platform.filesDir like the
               amster-files-configmap does: the mount's subPath is the
               sha256 of the RELATIVE filename, so the two sides must agree
               exactly or the pod fails on a missing key (or silently skips
               a script present only on one side). */}}
          {{- $dir := include "platform.filesDir" . }}
          {{- range $path, $_ := .Files.Glob (printf "%s/amster/scripts/**" $dir) }}
          - name: amster-scripts
            mountPath: /amster-scripts/{{ $path | replace (printf "%s/amster/scripts/" $dir) "" }}
            subPath: {{ $path | replace (printf "%s/amster/scripts/" $dir) "" | sha256sum }}
          {{- end }}
          - name: config
            mountPath: /amster-import
            readOnly: true
          - name: amster-secrets
            mountPath: /var/run/secrets/amster
            readOnly: true
          - name: export-files
            mountPath: /var/tmp/amster
      containers:
        - name: pause
          securityContext:
            {{- toYaml .Values.amster.securityContext | nindent 12 }}
          image: {{ include "platform.imageRef" (list . (list .Values.amster.image "amster" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.amster.image.pullPolicy }}
          args:
            - {{ include "platform.amShell" . }}
            - -c
            - sleep ${AMSTER_DURATION:-10}
          envFrom:
          - configMapRef:
              name: platform-config
          - configMapRef:
              name: amster-function
              optional: true
          {{- if .Values.amster.env.DURATION }}
          env:
          - name: AMSTER_DURATION
            value: {{ .Values.amster.env.DURATION | quote }}
          {{- else if eq (.Values.platform.imageMode | default "base") "forgeops" }}
          env:
          - name: IMAGE_MODE
            value: forgeops
          - name: CONFIG_PROFILE
            value: default
          {{- end }}
          readinessProbe:
            exec:
              command:
                - cat
                - /etc/hosts
            {{- with .Values.amster.readinessProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.amster.resources | nindent 12 }}
          volumeMounts:
          - name: export-files
            mountPath: /var/tmp/amster
      {{- with .Values.amster.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.amster.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
      {{- if .Values.amster.tolerations }}
        {{- toYaml .Values.amster.tolerations | nindent 8 }}
      {{- else if .Values.platform.tolerations }}
        {{- toYaml .Values.platform.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
