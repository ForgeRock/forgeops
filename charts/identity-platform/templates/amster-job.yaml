{{- if and (or .Release.IsInstall .Values.amster.force) .Values.amster.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: amster-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    {{- if .Values.amster.deleteOnSuccess }}
    "helm.sh/hook-delete-policy": "hook-succeeded,before-hook-creation"
    {{- end }}
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with .Values.amster.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.amster.backoffLimit }}
  {{- if .Values.amster.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.amster.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      annotations:
        {{- if .Values.platform.annotations.deploymentDate.enabled }}
        deployment-date: {{ now | quote }}
        {{- end }}
        {{- with .Values.amster.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "identity-platform.selectorLabels" . | nindent 8 }}
        {{- with .Values.amster.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: {{ .Values.amster.restartPolicy }}
      {{- if .Values.amster.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.amster.image.imagePullSecrets | nindent 8 }}
      {{- else if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "identity-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.amster.podSecurityContext | nindent 8 }}
      volumes:
        - name: amster-scripts
          configMap:
            name: amster-scripts
        - name: config
          configMap:
            name: amster-config
            optional: true
        - name: amster-secrets
          secret:
            secretName: amster
            items:
              - key: {{ include "amster.ssh.private_key_name" . | quote }}
                path: id_rsa
        - name: platform-config
          configMap:
            name: platform-config
        - name: export-files
          emptyDir: {}
      initContainers:
        - name: amster
          securityContext:
            {{- toYaml .Values.amster.securityContext | nindent 12 }}
          image: {{ include "platform.imageRef" (list . (list .Values.amster.image "amster" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.amster.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              {{- if eq (.Values.platform.imageMode | default "base") "forgeops" }}
              {{/* The pingamster single-mode image stages the deployment
                   assets (CONFIG_PROFILE overlay) unapplied at
                   /opt/amster-forgeops. The image entrypoint wrapper applies
                   them -- but this init container overrides the entrypoint
                   with its own command, so apply them here instead. Upstream
                   (docker/amster/Dockerfile) bakes the profile DIRECTLY into
                   /opt/amster at build time, which is why this worked on
                   clusters deployed before the staged-overlay refactor. The
                   chart cm scripts (copied below) intentionally win over the
                   staged forgeops scripts. */}}
              if [ -d /opt/amster-forgeops/profile/config ]; then
                cp -r /opt/amster-forgeops/profile/. /opt/amster/
              fi
              {{/* The staged profile carries the client/agent passwords as
                   AM env-substitutions with DEMO fallbacks
                   (&{idm.rs.client.secret|password}). Substitute the real
                   helm-generated values so the AM-side clients match the
                   secrets the IDM pod actually uses. The gateway-related
                   secrets (ig.agent.password, ig.rs.client.secret,
                   pit.client.secret) are left at their demo fallbacks on
                   purpose: the gateway image bakes the same demo secret
                   into its amSecretsProvider, so demo-vs-demo is
                   consistent; substituting only one side would break the
                   pairing. */}}
              for pair in \
                "idm.rs.client.secret|$IDM_RS_CLIENT_SECRET" \
                "idm.provisioning.client.secret|$IDM_PROVISIONING_CLIENT_SECRET"
              do
                name="${pair%%|*}"; value="${pair#*|}"
                [ -n "$value" ] || continue
                grep -rl "&{${name}|" /opt/amster/config 2>/dev/null | while IFS= read -r f; do
                  sed -i "s|&{${name}[^}]*}|${value}|g" "$f"
                done
              done
              {{- end }}
              for f in $(find /amster-scripts); do
                cp -r $f /opt/amster/ && chmod 775 /opt/amster/$(basename $f)
              done
              [ -z "$FUNCTION" ] && FUNCTION="import"
              ./docker-entrypoint.sh $FUNCTION
          env:
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          {{- if eq (.Values.platform.imageMode | default "base") "forgeops" }}
          # The pingamster single-mode image stages the deployment assets
          # (CONFIG_PROFILE overlay + forgeops scripts) unapplied at
          # /opt/amster-forgeops; the image entrypoint applies them only in
          # forgeops runtime mode.
          - name: IMAGE_MODE
            value: forgeops
          - name: CONFIG_PROFILE
            value: default
          {{- end }}
          envFrom:
          - configMapRef:
              name: platform-config
          - configMapRef:
              name: amster-function
              optional: true
          - secretRef:
              name: amster-env-secrets
          resources:
            {{- toYaml .Values.amster.resources | nindent 12 }}
          volumeMounts:
          {{- range $path, $_ := .Files.Glob "files/amster/scripts/**" }}
          - name: amster-scripts
            mountPath: /amster-scripts/{{ $path | replace "files/amster/scripts/" "" }}
            subPath: {{ $path | replace "files/amster/scripts/" "" | sha256sum }}
          {{- end }}
          - name: config
            mountPath: /opt/amster/config/amster-import.tar.gz
            subPath: amster-import.tar.gz
          - name: amster-secrets
            mountPath: /var/run/secrets/amster
            readOnly: true
          - name: export-files
            mountPath: /var/tmp/amster
      containers:
        - name: pause
          securityContext:
            {{- toYaml .Values.amster.securityContext | nindent 12 }}
          image: {{ include "platform.imageRef" (list . (list .Values.amster.image "amster" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.amster.image.pullPolicy }}
          args:
            - {{ include "platform.amShell" . }}
            - -c
            - sleep ${AMSTER_DURATION:-10}
          envFrom:
          - configMapRef:
              name: platform-config
          - configMapRef:
              name: amster-function
              optional: true
          {{- if .Values.amster.env.DURATION }}
          env:
          - name: AMSTER_DURATION
            value: {{ .Values.amster.env.DURATION | quote }}
          {{- else if eq (.Values.platform.imageMode | default "base") "forgeops" }}
          env:
          - name: IMAGE_MODE
            value: forgeops
          - name: CONFIG_PROFILE
            value: default
          {{- end }}
          readinessProbe:
            exec:
              command:
                - cat
                - /etc/hosts
            {{- with .Values.amster.readinessProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.amster.resources | nindent 12 }}
          volumeMounts:
          - name: export-files
            mountPath: /var/tmp/amster
      {{- with .Values.amster.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.amster.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
      {{- if .Values.amster.tolerations }}
        {{- toYaml .Values.amster.tolerations | nindent 8 }}
      {{- else if .Values.platform.tolerations }}
        {{- toYaml .Values.platform.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
