{{- if and (or .Release.IsInstall .Values.ds_set_passwords.force) .Values.ds_set_passwords.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: ds-set-passwords-{{ .Release.Revision }}
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with .Values.ds_set_passwords.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.ds_set_passwords.backoffLimit }}
  {{- if .Values.ds_set_passwords.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.ds_set_passwords.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      annotations:
        {{- if .Values.platform.annotations.deploymentDate.enabled }}
        deployment-date: {{ now | quote }}
        {{- end }}
        {{- with .Values.ds_set_passwords.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "identity-platform.selectorLabels" . | nindent 8 }}
        {{- with .Values.ds_set_passwords.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: {{ .Values.ds_set_passwords.restartPolicy }}
      {{- if and .Values.ds_set_passwords.image .Values.ds_set_passwords.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.ds_set_passwords.image.imagePullSecrets | nindent 8 }}
      {{- else if and .Values.ds_idrepo.image.imagePullSecrets (or (not .Values.ds_set_passwords.image) (not .Values.ds_set_passwords.image.repository)) }}
      imagePullSecrets:
        {{- toYaml .Values.ds_idrepo.image.imagePullSecrets | nindent 8 }}
      {{- else if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "identity-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.ds_set_passwords.podSecurityContext | nindent 8 }}
      volumes:
        - name: passwords
          secret:
            secretName: ds-passwords
        - name: ds-set-passwords
          configMap:
            name: ds-set-passwords-scripts
            defaultMode: 0755
      containers:
        - name: ds-set-passwords
          securityContext:
            {{- toYaml .Values.ds_set_passwords.securityContext | nindent 12 }}
          {{/* The ds-set-passwords scripts are the one POSIX tree shared by
               both image lines (no pipefail: dash, the
               Debian /bin/sh, rejects it), so the job no longer depends on
               an image-line/pipefail pairing; it follows ds_idrepo.image
               (the same image the DS statefulsets run) so the ldapsearch/
               ds tooling versions always match the DS pods; in forgeops
               mode the deployer re-points ds_idrepo.image at the Alpine
               line and this job follows. ds_set_passwords.image, when set,
               overrides per key over the ds_idrepo image. */}}
          {{- if .Values.ds_set_passwords.image }}
          {{/* Override block set: merge ds_idrepo.image into a deepCopy of
               the override, then resolve the result through
               platform.imageRef. The override is merge's destination, so
               its non-empty keys win and the keys it leaves unset or empty
               are filled from ds_idrepo (repository, name, tag,
               pullPolicy) -- e.g. the pullPolicy-only block `forgeops env`
               generates keeps the job on the image the statefulsets run,
               including a registry they were re-pointed at, instead of
               landing on the platform default registry with a tag that
               only exists in the private one. merge (not
               mustMergeOverwrite as in the enduser-ui alias) is deliberate:
               mergeOverwrite would let an explicitly-empty override key
               clobber ds_idrepo's value and land the image on the platform
               chain, against the chart-wide empty-means-default values
               convention. The deepCopy keeps that merge's in-place write
               off the live values maps. imageRef renders digest-form tags
               with "@", and when even ds_idrepo's repository is empty
               falls back to the platform chain. Note an explicit override
               name is honored only when neither side pins a repository:
               under a repository pin, imageRef composes from the pinned
               repository verbatim, so the name key is dropped (same
               semantics as ds_idrepo's own name under a pin). */}}
          {{- $image := merge (deepCopy .Values.ds_set_passwords.image) .Values.ds_idrepo.image }}
          image: {{ include "platform.imageRef" (list . (list $image "ds" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ $image.pullPolicy }}
          {{- else }}
          image: {{ include "platform.imageRef" (list . (list .Values.ds_idrepo.image "ds" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.ds_idrepo.image.pullPolicy }}
          {{- end }}
          command:
            - sh
            - -c
            - /opt/opendj/start.sh
          envFrom:
          - secretRef:
              name: ds-env-secrets
          - secretRef:
              name: old-ds-env-secrets
              optional: true
          readinessProbe:
            exec:
              command:
                - cat
                - /etc/hosts
            {{- with .Values.ds_set_passwords.readinessProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.ds_set_passwords.resources | nindent 12 }}
          volumeMounts:
          - name: passwords
            mountPath: /var/run/secrets/opendj-passwords
          - name: ds-set-passwords
            mountPath: /opt/opendj/start.sh
            subPath: start.sh
          - name: ds-set-passwords
            mountPath: /opt/opendj/ds-passwords.sh
            subPath: ds-passwords.sh
      {{- with .Values.ds_set_passwords.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ds_set_passwords.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
      {{- if .Values.ds_set_passwords.tolerations }}
        {{- toYaml .Values.ds_set_passwords.tolerations | nindent 8 }}
      {{- else if .Values.platform.tolerations }}
        {{- toYaml .Values.platform.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
