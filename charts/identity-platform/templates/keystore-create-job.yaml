{{- if eq (include "keystore_create.enabled" .) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: keystore-create-{{ .Release.Revision }}
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with .Values.keystore_create.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.keystore_create.backoffLimit }}
  {{- if .Values.keystore_create.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.keystore_create.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      annotations:
        {{- if .Values.platform.annotations.deploymentDate.enabled }}
        deployment-date: {{ now | quote }}
        {{- end }}
        {{- with .Values.keystore_create.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "identity-platform.selectorLabels" . | nindent 8 }}
        {{- with .Values.keystore_create.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: {{ .Values.keystore_create.restartPolicy }}
      {{- if .Values.keystore_create.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.keystore_create.image.imagePullSecrets | nindent 8 }}
      {{- else if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: keystore-create
      securityContext:
        {{- toYaml .Values.keystore_create.podSecurityContext | nindent 8 }}
      volumes:
        - name: keystore-secrets
          projected:
            sources:
            - secret:
                name: keystore-create
                items:
                - key: KEYSTORE_PASSWORD
                  path: .storepass
                - key: KEYSTORE_PASSWORD
                  path: .keypass
            - secret:
                name: ds-passwords
                items:
                - key: dirmanager.pw
                  path: dirmanager.pw
        - name: keystore-secret
          secret:
            secretName: {{ .Values.keystore_create.config.secret.name }}
            optional: true
        - name: platform-config
          configMap:
            name: platform-config
        - name: keystore-create
          configMap:
            name: keystore-create
            defaultMode: 0755
        - name: keystore-config
          configMap:
            name: keystore
        - name: keystore
          emptyDir: {}
      initContainers:
        - name: keystore-create
          securityContext:
            {{- toYaml .Values.keystore_create.securityContext | nindent 12 }}
          {{/* Run the keystore creator on the configured initImage (an AM
               image): keystore-create.sh uses the keytool jar paths under
               the image's FORGEROCK_HOME. Use the dedicated initImage
               values (the Debian default am:latest) rather than am.image,
               which the live values re-point at the Alpine pingam image —
               that image has no bash (the script's shebang) and puts the
               keystore tooling at /home/ping. initImage is an AM product
               image, so it resolves via the platform chain
               (platform.imageRepository + the "am" name; see
               platform.imageRef in _helpers.tpl). */}}
          image: {{ include "platform.imageRef" (list . (list .Values.keystore_create.initImage "am" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.keystore_create.initImage.pullPolicy }}
          command: ["/home/forgerock/keystore-create.sh"]
          env:
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          envFrom:
          - configMapRef:
              name: platform-config
          resources:
            {{- toYaml .Values.keystore_create.resources | nindent 12 }}
          volumeMounts:
          - name: keystore-config
            mountPath: /home/forgerock/keystore.json
            subPath: keystore.json
          - name: keystore-secrets
            mountPath: /var/run/secrets/keystore
          - name: keystore-create
            mountPath: /home/forgerock/keystore-create.sh
            subPath: keystore-create.sh
          - name: keystore
            mountPath: /keystore
          - name: keystore-secret
            mountPath: /keystore-existing
            readOnly: true
      containers:
        - name: keystore-secret-create
          securityContext:
            {{- toYaml .Values.keystore_create.securityContext | nindent 12 }}
          image: "{{ .Values.keystore_create.image.repository }}:{{ .Values.keystore_create.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.keystore_create.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              {{- if .Values.keystore_create.config.secret.replace }}
              kubectl delete secret $SECRET_NAME --namespace=$NAMESPACE
              kubectl create secret generic $SECRET_NAME \
                --from-file=/keystore/keystore.jceks --namespace=$NAMESPACE
              {{- else }}
              # The init container probed the EXISTING keystore secret (if
              # any) with the CURRENT store password and wrote
              # /keystore/.reuse-existing when it opens. Without the marker
              # the secret either does not exist or was left by a previous
              # install and does not open with the current password (the
              # secret is not part of the release manifest, so it survives
              # uninstall; its keystore is encrypted with that install's
              # password) -- replace it so the platform's components can
              # open it.
              if [ -f /keystore/.reuse-existing ]; then
                echo "Existing $SECRET_NAME opens with the current store password; leaving it in place."
              else
                kubectl delete secret $SECRET_NAME --namespace=$NAMESPACE --ignore-not-found
                kubectl create secret generic $SECRET_NAME \
                  --from-file=/keystore/keystore.jceks --namespace=$NAMESPACE
              fi
              {{- end }}
          env:
          - name: SECRET_NAME
            value: {{ .Values.keystore_create.config.secret.name }}
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          envFrom:
          - configMapRef:
              name: platform-config
          readinessProbe:
            exec:
              command:
                - cat
                - /etc/hosts
            {{- with .Values.keystore_create.readinessProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.keystore_create.resources | nindent 12 }}
          volumeMounts:
          - name: keystore
            mountPath: /keystore
      {{- with .Values.keystore_create.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keystore_create.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
      {{- if .Values.keystore_create.tolerations }}
        {{- toYaml .Values.keystore_create.tolerations | nindent 8 }}
      {{- else if .Values.platform.tolerations }}
        {{- toYaml .Values.platform.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
