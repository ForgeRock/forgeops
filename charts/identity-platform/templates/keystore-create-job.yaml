{{- if eq (include "keystore_create.enabled" .) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: keystore-create-{{ .Release.Revision }}
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with .Values.keystore_create.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.keystore_create.backoffLimit }}
  {{- if .Values.keystore_create.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.keystore_create.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      annotations:
        {{- if .Values.platform.annotations.deploymentDate.enabled }}
        deployment-date: {{ now | quote }}
        {{- end }}
        {{- with .Values.keystore_create.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "identity-platform.selectorLabels" . | nindent 8 }}
        {{- with .Values.keystore_create.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: {{ .Values.keystore_create.restartPolicy }}
      {{- if .Values.keystore_create.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.keystore_create.image.imagePullSecrets | nindent 8 }}
      {{- else if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: keystore-create
      securityContext:
        {{- toYaml .Values.keystore_create.podSecurityContext | nindent 8 }}
      volumes:
        - name: keystore-secrets
          projected:
            sources:
            - secret:
                name: keystore-create
                items:
                - key: KEYSTORE_PASSWORD
                  path: .storepass
                - key: KEYSTORE_PASSWORD
                  path: .keypass
            - secret:
                name: ds-passwords
                items:
                - key: dirmanager.pw
                  path: dirmanager.pw
        {{- if not .Values.keystore_create.config.secret.replace }}
        {{/* The probe mount of the EXISTING secret: pointless when
             replace=true deletes and recreates unconditionally (and the
             probe result is ignored there), so gate it off. */}}
        - name: keystore-secret
          secret:
            secretName: {{ .Values.keystore_create.config.secret.name }}
            optional: true
        {{- end }}
        - name: platform-config
          configMap:
            name: platform-config
        - name: keystore-create
          configMap:
            name: keystore-create
            defaultMode: 0755
        - name: keystore-config
          configMap:
            name: keystore
        - name: keystore
          emptyDir: {}
      initContainers:
        - name: keystore-create
          securityContext:
            {{- toYaml .Values.keystore_create.securityContext | nindent 12 }}
          {{/* Run the keystore creator on the configured initImage (an AM
               image): keystore-create.sh needs keytool + jq, both on PATH in
               every AM image line. The script variant follows
               platform.filesDir (POSIX for the alpine line, bash for the
               Debian line), so initImage is free to follow the same image
               the AM server pods run: resolve via the platform chain
               (platform.imageRepository + the "am" name; see
               platform.imageRef in _helpers.tpl) -- in forgeops image mode
               the deployer re-points platform.imageRepository at the alpine
               line and this job follows. An explicit initImage.repository
               always wins. */}}
          image: {{ include "platform.imageRef" (list . (list .Values.keystore_create.initImage "am" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ .Values.keystore_create.initImage.pullPolicy }}
          command: ["/home/forgerock/keystore-create.sh"]
          env:
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          # Explicit env, NOT derivable from platform-config: the marker
          # path must match the push container's $KEYSTORE_MARKER even if a
          # user's platform.configMap.data sets KEYSTORE_DIR (explicit env
          # wins over envFrom).
          - name: KEYSTORE_DIR
            value: /keystore
          - name: EXISTING_DIR
            value: /keystore-existing
          envFrom:
          - configMapRef:
              name: platform-config
          resources:
            {{- toYaml .Values.keystore_create.resources | nindent 12 }}
          volumeMounts:
          - name: keystore-config
            mountPath: /home/forgerock/keystore.json
            subPath: keystore.json
          - name: keystore-secrets
            mountPath: /var/run/secrets/keystore
          - name: keystore-create
            mountPath: /home/forgerock/keystore-create.sh
            subPath: keystore-create.sh
          - name: keystore
            mountPath: /keystore
          {{- if not .Values.keystore_create.config.secret.replace }}
          - name: keystore-secret
            mountPath: /keystore-existing
            readOnly: true
          {{- end }}
      containers:
        - name: keystore-secret-create
          securityContext:
            {{- toYaml .Values.keystore_create.securityContext | nindent 12 }}
          image: "{{ .Values.keystore_create.image.repository }}:{{ .Values.keystore_create.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.keystore_create.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              {{- if .Values.keystore_create.config.secret.replace }}
              {{/* Atomic replace, same shape as the install path below: a
                   delete + create pair would leave the namespace with NO
                   keystore secret if the create failed. --dry-run=client
                   renders the secret from the built keystore and apply
                   swaps it in one step. */}}
              kubectl create secret generic $SECRET_NAME \
                --from-file=/keystore/keystore.jceks --namespace=$NAMESPACE \
                --dry-run=client -o yaml | kubectl apply -f -
              {{- else if .Release.IsUpgrade }}
              # UPGRADE of an existing release: never replace the keystore
              # secret on the probe's signal alone. A password mismatch here
              # can be a LIVE deployment whose KEYSTORE_PASSWORD was changed
              # on purpose (e.g. a custom-secrets migration); rebuilding the
              # keystore then would silently mint fresh JWT-signing and IDM
              # symmetric keys and invalidate signed tokens and encrypted
              # values. Keep the old create-if-absent semantics: an existing
              # secret is left alone and the mismatch fails LOUDLY when the
              # platform components try to open it. Set
              # keystore_create.config.secret.replace=true to replace
              # deliberately.
              if kubectl get secret $SECRET_NAME --namespace=$NAMESPACE >/dev/null 2>&1; then
                echo "Upgrade: existing $SECRET_NAME left in place (set keystore_create.config.secret.replace=true to replace it)."
              else
                kubectl create secret generic $SECRET_NAME \
                  --from-file=/keystore/keystore.jceks --namespace=$NAMESPACE
              fi
              {{- else }}
              # INSTALL (no deployed release yet): the init container probed
              # the EXISTING keystore secret (if any) with the CURRENT store
              # password and wrote $KEYSTORE_MARKER when it opens. Without
              # the marker the secret either does not exist or was left by
              # an UNINSTALLED previous install (the secret is not part of
              # the release manifest, so helm uninstall leaves it; its
              # keystore is encrypted with that install's password) --
              # replace it ATOMICALLY so the platform's components can open
              # it. (An install can never be the password-migration case
              # above: there is no deployed release to migrate.)
              if [ -f "$KEYSTORE_MARKER" ]; then
                echo "Existing $SECRET_NAME opens with the current store password; leaving it in place."
              else
                kubectl create secret generic $SECRET_NAME \
                  --from-file=/keystore/keystore.jceks \
                  --namespace=$NAMESPACE --dry-run=client -o yaml \
                  | kubectl apply --namespace=$NAMESPACE -f -
              fi
              {{- end }}
          env:
          - name: SECRET_NAME
            value: {{ .Values.keystore_create.config.secret.name }}
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          # Explicit env, NOT derivable from platform-config: both marker
          # paths must agree even if a user's platform.configMap.data sets
          # KEYSTORE_DIR (explicit env wins over envFrom).
          - name: KEYSTORE_MARKER
            value: /keystore/.reuse-existing
          envFrom:
          - configMapRef:
              name: platform-config
          readinessProbe:
            exec:
              command:
                - cat
                - /etc/hosts
            {{- with .Values.keystore_create.readinessProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.keystore_create.resources | nindent 12 }}
          volumeMounts:
          - name: keystore
            mountPath: /keystore
      {{- with .Values.keystore_create.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keystore_create.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
      {{- if .Values.keystore_create.tolerations }}
        {{- toYaml .Values.keystore_create.tolerations | nindent 8 }}
      {{- else if .Values.platform.tolerations }}
        {{- toYaml .Values.platform.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
