{{- if eq (include "platform.routeEnabled" .) "true" }}
{{/* OpenShift Routes (FC2e, opt-in via platform.route.enabled; unset follows
     platform.openshift.enabled via platform.routeEnabled in _helpers.tpl).
     Renders the Route set live-tested on OpenShift 4.22.14 (2026-11-04/05):
     AM edge + the IDM/UI path set, all hostnames equal to
     platform.ingress.hosts[0] (the chart FQDN — AM FQDN-validates OAuth2
     requests against it, so Route host must match the chart FQDN, never the
     reverse; single-host contract, multi-host values render Routes for
     hosts[0] only). Termination: AM's 8081 ("https" container port) is PLAIN
     HTTP behind Tomcat's TLS-offload connector, so edge is the only working
     mode — passthrough fails the handshake, reencrypt 503s (live-proven
     4.22.14); platform.route.am.termination exists so a future AM TLS image
     can opt into reencrypt. ONE HOST, PATH-SPLIT: the first Route claiming
     a host gets an exclusive claim (a second whole-host Route renders
     HostAlreadyClaimed), so AM claims the whole host and the others split
     paths exactly as the Ingress templates do. Certificates: Routes carry
     no explicit cert — the router's default certificate serves TLS; pinning
     an explicit cert is follow-up work. */}}
{{- $hosts := .Values.platform.ingress.hosts }}
{{- if not $hosts }}
{{- fail (printf "platform.route.enabled is true but platform.ingress.hosts is empty or unset - the Route hostnames come from hosts[0] (the chart FQDN; AM FQDN-validates OAuth2 requests against it). Set platform.ingress.hosts[0] even with ingress disabled.") }}
{{- end }}
{{- $fqdn := first $hosts }}
{{- $term := .Values.platform.route.am.termination | default "edge" }}
{{- /* The OpenShift Route API rejects passthrough + insecureEdgeTerminationPolicy:
     Allow outright ("cannot have both spec.tls.termination: passthrough and
     spec.tls.insecureEdgeTerminationPolicy: Allow"; None and Redirect are
     compatible - openshift/api route validation). Fail at render rather than
     letting the API reject the object at apply time. */}}
{{- if and (eq $term "passthrough") (eq .Values.platform.route.tls.insecurePolicy "Allow") }}
{{- fail "platform.route.am.termination: passthrough cannot combine with platform.route.tls.insecurePolicy: Allow (the OpenShift Route API rejects it). Use insecurePolicy None or Redirect, or drop passthrough - note AM's 8081 is plain HTTP so passthrough cannot serve AM anyway (see template header)." }}
{{- end }}
{{- /* Per-component guards are plain boolean tests (house style). The AM
     Route requires the am Service (else it dangles), so its guard also tests
     am.enabled. The end-user-ui guard honors the deprecated end_user_ui
     alias exactly as every sibling end-user-ui template does. */}}
{{- $eui := .Values.enduser_ui }}
{{- $eui = mustMergeOverwrite (deepCopy $eui) (deepCopy (.Values.end_user_ui | default dict)) }}
{{- if and .Values.am.enabled .Values.platform.route.am.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.platform.route.am.name }}
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  host: {{ $fqdn | quote }}
  tls:
    termination: {{ $term }}
    insecureEdgeTerminationPolicy: {{ .Values.platform.route.tls.insecurePolicy }}
  to:
    kind: Service
    name: am
    weight: 100
  port:
    {{- if include "platform.amHttpsPort" . }}
    targetPort: https
    {{- else }}
    targetPort: http
    {{- end }}
  wildcardPolicy: None
---
{{- end }}
{{- if and .Values.idm.enabled .Values.platform.route.idm.enabled }}
{{/* IDM + idm-admin-ui paths, mirroring templates/idm-ingress.yaml. IDM
     serves plain HTTP on 8080; edge termination keeps TLS at the router. */}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.platform.route.idm.name }}
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  host: {{ $fqdn | quote }}
  path: /openidm
  tls:
    termination: edge
  to:
    kind: Service
    name: idm
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.platform.route.idm.name }}-upload
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  host: {{ $fqdn | quote }}
  path: /upload
  tls:
    termination: edge
  to:
    kind: Service
    name: idm
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.platform.route.idm.name }}-export
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  host: {{ $fqdn | quote }}
  path: /export
  tls:
    termination: edge
  to:
    kind: Service
    name: idm
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.platform.route.idm.name }}-admin
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  host: {{ $fqdn | quote }}
  path: /admin
  tls:
    termination: edge
  to:
    kind: Service
    {{- if .Values.idm_admin_ui.enabled }}
    name: idm-admin-ui
    {{- else }}
    name: idm
    {{- end }}
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
---
{{- if .Values.idm_admin_ui.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.platform.route.idm.name }}-api
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  host: {{ $fqdn | quote }}
  path: /api
  tls:
    termination: edge
  to:
    kind: Service
    name: idm-admin-ui
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
---
{{- end }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.platform.route.idm.name }}-openicf
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  host: {{ $fqdn | quote }}
  path: /openicf
  tls:
    termination: edge
  to:
    kind: Service
    name: idm
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
---
{{- end }}
{{- if and .Values.login_ui.enabled .Values.platform.route.loginUi.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: login-ui
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  host: {{ $fqdn | quote }}
  path: /am/XUI
  tls:
    termination: edge
  to:
    kind: Service
    name: login-ui
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
---
{{- end }}
{{- if and $eui.enabled .Values.platform.route.endUserUi.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "platform.endUserUiName" . }}
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  host: {{ $fqdn | quote }}
  path: /enduser
  tls:
    termination: edge
  to:
    kind: Service
    name: {{ include "platform.endUserUiName" . }}
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
---
{{- end }}
{{- if and .Values.admin_ui.enabled .Values.platform.route.adminUi.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: admin-ui
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  host: {{ $fqdn | quote }}
  path: /platform
  tls:
    termination: edge
  to:
    kind: Service
    name: admin-ui
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
{{- end }}
{{- end }}
