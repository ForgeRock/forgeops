{{- /* Values alias: prefer enduser_ui, fall back to the deprecated
     end_user_ui key (see platform.endUserUi in _helpers.tpl). */}}
{{- $eui := .Values.enduser_ui }}
{{- $eui = mustMergeOverwrite (deepCopy $eui) (deepCopy (.Values.end_user_ui | default dict)) }}
{{- if and $eui.enabled .Values.platform.ingress.enabled -}}
{{- $svcPort := $eui.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: end-user-ui
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with $eui.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if $eui.ingress.annotations }}
      {{- toYaml $eui.ingress.annotations | nindent 4 }}
    {{- else if .Values.platform.ingress.annotations }}
      {{- toYaml .Values.platform.ingress.annotations | nindent 4 }}
    {{- end }}
    {{- if and .Values.platform.cert_manager.enabled .Values.platform.ingress.tls.issuer.name }}
    {{- if (eq "ClusterIssuer" .Values.platform.ingress.tls.issuer.kind) }}
    cert-manager.io/cluster-issuer: {{ .Values.platform.ingress.tls.issuer.name }}
    {{- else }}
    cert-manager.io/issuer: {{ .Values.platform.ingress.tls.issuer.name }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ $eui.ingress.className | default .Values.platform.ingress.className }}
  tls:
    {{- range $host := .Values.platform.ingress.hosts }}
    - hosts:
        - {{ $host | quote }}
      {{- if $.Values.platform.ingress.tls.secret.name }}
      secretName: {{ $.Values.platform.ingress.tls.secret.name }}
      {{- else }}
      secretName: "tls-{{ $host }}"
      {{- end }}
    {{- end }}
  rules:
    {{- range $host := .Values.platform.ingress.hosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /enduser
            pathType: Prefix
            backend:
              service:
                name: end-user-ui
                port:
                  number: {{ $svcPort }}
    {{- end }}
{{- end }}
