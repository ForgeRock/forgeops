{{- /* Values alias: prefer enduser_ui, fall back to the deprecated
     end_user_ui key (see platform.endUserUi in _helpers.tpl). */}}
{{- $eui := .Values.enduser_ui }}
{{- $eui = mustMergeOverwrite (deepCopy $eui) (deepCopy (.Values.end_user_ui | default dict)) }}
{{- if $eui.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: end-user-ui-init-scripts
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with $eui.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{ (.Files.Glob "files/end-user-ui/init-scripts/**.sh").AsConfig | nindent 2 }}
{{- end }}
