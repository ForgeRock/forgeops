{{- if and .Values.idm_admin_ui.enabled .Values.idm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idm-admin-ui
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with .Values.idm_admin_ui.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.idm_admin_ui.autoscaling.enabled }}
  replicas: {{ .Values.idm_admin_ui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "identity-platform.selectorLabels" . | nindent 6 }}
      {{- with .Values.idm_admin_ui.podLabels }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
  template:
    metadata:
      annotations:
        {{- if .Values.platform.annotations.deploymentDate.enabled }}
        deployment-date: {{ now | quote }}
        {{- end }}
        {{- with .Values.idm_admin_ui.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "identity-platform.selectorLabels" . | nindent 8 }}
        {{- with .Values.idm_admin_ui.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.idm_admin_ui.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.idm_admin_ui.image.imagePullSecrets | nindent 8 }}
      {{- else if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "identity-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.idm_admin_ui.podSecurityContext | nindent 8 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: var-cache-nginx
          emptyDir: {}
        - name: var-run
          emptyDir: {}
      containers:
        - name: idm-admin-ui
          securityContext:
            {{- toYaml .Values.idm_admin_ui.securityContext | nindent 12 }}
          image: "{{ .Values.idm_admin_ui.image.repository }}:{{ .Values.idm_admin_ui.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.idm_admin_ui.image.pullPolicy }}
          lifecycle:
            preStop:
              exec:
                command: ["/usr/sbin/nginx", "-s", "quit"]
          env:
          {{- with .Values.platform.env }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.idm_admin_ui.env }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          envFrom:
          {{- with .Values.platform.envFrom }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.idm_admin_ui.envFrom }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            {{- with .Values.idm_admin_ui.livenessProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            {{- with .Values.idm_admin_ui.readinessProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /ready
              port: http
            {{- with .Values.idm_admin_ui.startupProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.idm_admin_ui.resources | nindent 12 }}
          volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: var-cache-nginx
            mountPath: /var/cache/nginx
          - name: var-run
            mountPath: /var/run
      {{- with .Values.idm_admin_ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.idm_admin_ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
      {{- if .Values.idm_admin_ui.tolerations }}
        {{- toYaml .Values.idm_admin_ui.tolerations | nindent 8 }}
      {{- else if .Values.platform.tolerations }}
        {{- toYaml .Values.platform.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
