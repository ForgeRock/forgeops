{{- if .Values.am.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: am
  annotations:
    {{- with .Values.platform.service.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with .Values.am.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.am.service.type }}
  ports:
    - port: {{ .Values.am.service.port }}
      targetPort: https
      protocol: TCP
      name: http
{{- /* am.service.httpsPort is mode-owned (platform.amHttpsPort): UNSET follows
     platform.openshift.enabled (81 there, absent elsewhere); an explicit
     number overrides the mode. The OpenShift router resolves a Route's
     targetPort against the SERVICE PORT NAME — AM's service port is named
     "http" while targeting the container port "https", so without this entry
     Routes resolve against a nonexistent name and 503 (live-proven 4.22.14,
     2026-11-04). The Route's targetPort branch resolves through the same
     helper. */}}
{{- with include "platform.amHttpsPort" . }}
    - port: {{ . }}
      targetPort: https
      protocol: TCP
      name: https
{{- end }}
  selector:
    {{- include "identity-platform.selectorLabels" . | nindent 4 }}
    {{- with .Values.am.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
