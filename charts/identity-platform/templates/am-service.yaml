{{- if .Values.am.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: am
  annotations:
    {{- with .Values.platform.service.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with .Values.am.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.am.service.type }}
  ports:
    - port: {{ .Values.am.service.port }}
      targetPort: https
      protocol: TCP
      name: http
{{- if .Values.am.service.httpsPort }}
{{/* OpenShift Route port-name resolution (FC2d): the OpenShift router
     resolves a Route's targetPort against the SERVICE PORT NAME, not the
     container port. This chart names the service port "http" while targeting
     the container port named "https" (AM's TLS-offload connector on 8081), so
     every naive Route (oc expose / oc create route --port) resolves against
     the name "https", finds no service port by that name, and renders an
     empty haproxy backend: 503 on every AM Route, all termination modes
     (live-proven 2026-11-04 on OpenShift 4.22.14: adding a port literally
     NAMED https converted the Route from 503 to 200). This conditional adds
     one port entry named "https" to THIS Service so Routes resolve natively
     — not a second Service resource. Default (unset): the ports list renders
     exactly as before — zero change for non-OpenShift deployers and for
     existing Scripts that reference port name http. GKE Ingress is
     unaffected either way: it resolves by port NUMBER on the Service. */}}
{{- /* comment moved above the if (trimming a comment inside a list can emit
     a stray blank line between entries) */}}
    - port: {{ .Values.am.service.httpsPort }}
      targetPort: https
      protocol: TCP
      name: https
{{- end }}
  selector:
    {{- include "identity-platform.selectorLabels" . | nindent 4 }}
    {{- with .Values.am.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
