{{- /* Values alias: prefer enduser_ui, fall back to the deprecated
     end_user_ui key (see platform.endUserUi in _helpers.tpl). */}}
{{- $eui := .Values.enduser_ui }}
{{- $eui = mustMergeOverwrite (deepCopy $eui) (deepCopy (.Values.end_user_ui | default dict)) }}
{{- if $eui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: end-user-ui
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with $eui.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not $eui.autoscaling.enabled }}
  replicas: {{ $eui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "identity-platform.selectorLabels" . | nindent 6 }}
      {{- with $eui.podLabels }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
  template:
    metadata:
      annotations:
        {{- if .Values.platform.annotations.deploymentDate.enabled }}
        deployment-date: {{ now | quote }}
        {{- end }}
        {{- with $eui.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "identity-platform.selectorLabels" . | nindent 8 }}
        {{- with $eui.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if $eui.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $eui.image.imagePullSecrets | nindent 8 }}
      {{- else if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "identity-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml $eui.podSecurityContext | nindent 8 }}
      volumes:
        - name: end-user-ui-init-scripts
          configMap:
            name: end-user-ui-init-scripts
            defaultMode: 0755
        - name: writeable
          emptyDir: {}
      initContainers:
        - name: filesystem-init
          image: {{ include "platform.imageRef" (list . (list $eui.image "enduser-ui" .Chart.AppVersion)) | quote }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: /scripts
              name: end-user-ui-init-scripts
            - mountPath: /writeable
              name: writeable
          command: [/scripts/filesystem-init.sh]
      containers:
        - name: end-user-ui
          securityContext:
            {{- toYaml $eui.securityContext | nindent 12 }}
          image: {{ include "platform.imageRef" (list . (list $eui.image "enduser-ui" .Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ $eui.image.pullPolicy }}
          lifecycle:
            preStop:
              exec:
                command: ["/usr/sbin/nginx", "-s", "quit"]
          env:
          - name: SUBFOLDER
            value: enduser
          - name: ROUTES_FILE
            value: routes.platform
          envFrom:
          - configMapRef:
              name: platform-config
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            exec:
              command: ['true']
            {{- with $eui.startupProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            {{- with $eui.livenessProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            {{- with $eui.readinessProbe }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $eui.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: writeable
              subPath: tmp
            - mountPath: /usr/share/nginx
              name: writeable
              subPath: usr/share/nginx
      {{- with $eui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $eui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
      {{- if $eui.tolerations }}
        {{- toYaml $eui.tolerations | nindent 8 }}
      {{- else if .Values.platform.tolerations }}
        {{- toYaml .Values.platform.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
