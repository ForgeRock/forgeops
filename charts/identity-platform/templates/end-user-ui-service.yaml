{{- /* Values alias: prefer enduser_ui, fall back to the deprecated
     end_user_ui key (see platform.endUserUi in _helpers.tpl). */}}
{{- $eui := .Values.enduser_ui }}
{{- $eui = mustMergeOverwrite (deepCopy $eui) (deepCopy (.Values.end_user_ui | default dict)) }}
{{- if $eui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: end-user-ui
  annotations:
    {{- with .Values.platform.service.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with $eui.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ $eui.service.type }}
  ports:
    - port: {{ $eui.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "identity-platform.selectorLabels" . | nindent 4 }}
    {{- with $eui.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
