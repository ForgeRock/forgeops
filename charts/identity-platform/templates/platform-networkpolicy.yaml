{{- if eq (include "platform.modeOwnedBool" (list . "networkPolicy")) "true" }}
{{/* NetworkPolicy templates (FC2e, opt-in): the four policies live-tested on
     OpenShift 4.22.14 (2026-11-04/05) under a default-deny namespace, the
     full user journey re-passing while they were applied. Gate:
     platform.networkPolicy.enabled is mode-owned — UNSET follows
     platform.openshift.enabled (platform.modeOwnedBool in _helpers.tpl); an
     explicit true/false overrides. Additive allow rules only; they coexist
     with a default-deny-all policy. Per-policy rationale, application
     timing, and the allowKubeApi tradeoff: how-tos/openshift-deployment.md
     and the platform.networkPolicy comments in values.yaml. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.platform.networkPolicy.namePrefix | default "identity-platform" }}-allow-same-namespace
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.platform.networkPolicy.namePrefix | default "identity-platform" }}-allow-dns
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.platform.networkPolicy.namePrefix | default "identity-platform" }}-allow-from-router
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
---
{{- if .Values.platform.networkPolicy.allowKubeApi }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.platform.networkPolicy.namePrefix | default "identity-platform" }}-allow-kubeapi-egress
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- end }}
