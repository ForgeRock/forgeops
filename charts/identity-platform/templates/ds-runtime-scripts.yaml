
{{- if or .Values.ds_cts.enabled .Values.ds_idrepo.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-runtime-scripts
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with .Values.idm.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{ (.Files.Glob (printf "%s/ds/runtime-scripts/*.sh" (include "platform.filesDir" .))).AsConfig | nindent 2 }}
  {{ (.Files.Glob (printf "%s/ds/runtime-scripts/rstatus" (include "platform.filesDir" .))).AsConfig | nindent 2 }}
  {{ (.Files.Glob (printf "%s/ds/runtime-scripts/support" (include "platform.filesDir" .))).AsConfig | nindent 2 }}
{{- end }}
{{- if .Values.ds_cts.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-cts-runtime-scripts
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with .Values.idm.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{ (.Files.Glob (printf "%s/ds/runtime-scripts/ds-cts/**" (include "platform.filesDir" .))).AsConfig | nindent 2 }}
{{- end }}
{{- if .Values.ds_idrepo.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-idrepo-runtime-scripts
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with .Values.idm.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{ (.Files.Glob (printf "%s/ds/runtime-scripts/ds-idrepo/**" (include "platform.filesDir" .))).AsConfig | nindent 2 }}
{{- end }}
