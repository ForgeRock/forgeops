{{- if .Values.am.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: am-entrypoint
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
data:
  {{ (.Files.Glob (printf "%s/am/entrypoint-scripts/entrypoint.sh" (include "platform.filesDir" .))).AsConfig | nindent 2 }}
{{- end }}