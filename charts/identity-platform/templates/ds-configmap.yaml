{{- if and (or .Values.ds_cts.enabled .Values.ds_idrepo.enabled)
    (or .Values.ds_cts.securityContext.readOnlyRootFilesystem .Values.ds_idrepo.securityContext.readOnlyRootFilesystem)}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-init-scripts
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
data:
  {{ (.Files.Glob (printf "%s/ds/init-scripts/**.sh" (include "platform.filesDir" .))).AsConfig | nindent 2 }}
{{- end }}
{{- /* The entrypoint override is only consumed by the forgeops-mode mounts
     (the debian ds image carries the identical script baked in); skip
     creating the ConfigMap in base mode. */}}
{{- if and (or .Values.ds_cts.enabled .Values.ds_idrepo.enabled)
    (eq (.Values.platform.imageMode | default "base") "forgeops") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-entrypoint
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
data:
  {{ (.Files.Glob (printf "%s/ds/docker-entrypoint.sh" (include "platform.filesDir" .))).AsConfig | nindent 2 }}
{{- end }}
