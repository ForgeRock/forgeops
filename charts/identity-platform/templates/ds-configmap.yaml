{{- if and (or .Values.ds_cts.enabled .Values.ds_idrepo.enabled)
    (or .Values.ds_cts.securityContext.readOnlyRootFilesystem .Values.ds_idrepo.securityContext.readOnlyRootFilesystem)}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-init-scripts
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
data:
  {{ (.Files.Glob (printf "%s/ds/init-scripts/**.sh" (include "platform.filesDir" .))).AsConfig | nindent 2 }}
{{- end }}
{{- /* The chart's ds entrypoint is canonical in BOTH image modes since
     FORGEOPS-6971 (one POSIX script tree): the statefulsets mount it over
     the image's baked copy everywhere. env.sh ships WITH it (same
     ConfigMap, mounted over the image's copy) because the entrypoint
     sources /opt/opendj/env.sh: an older ds image may bake a BASH env.sh,
     and under dash a bash-only `[[ =~ ]]` fails as a silent command error
     (not a syntax error), mis-deriving DS_BOOTSTRAP_REPLICATION_SERVERS
     to point every pod at itself. Shipping env.sh from the chart closes
     that skew: the sourced file is the chart's POSIX copy. env.sh's
     IMAGE_MODE branches default per-mode values for the password-file and
     PEM-cert-dir paths; the statefulsets set ALL of those envs explicitly
     (DS_SET_UID_ADMIN_AND_MONITOR_PASSWORDS + both password files, and
     SSL_CERT_DIR/MASTER_CERT_DIR/TRUSTSTORE_DIR at the PEM secrets the
     statefulsets mount in both modes), so in a chart deployment the
     env.sh defaults never apply in either branch. The branching remains
     meaningful only for standalone (non-chart) image runs. subPath
     ConfigMap mounts do NOT live-update: an entrypoint/env.sh change
     reaches pods on their next rollout (no checksum annotation here by
     design — every entrypoint edit should not roll DS). */}}
{{- if or .Values.ds_cts.enabled .Values.ds_idrepo.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-entrypoint
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
data:
  {{ (.Files.Glob (printf "%s/ds/{docker-entrypoint.sh,env.sh}" (include "platform.filesDir" .))).AsConfig | nindent 2 }}
{{- end }}
