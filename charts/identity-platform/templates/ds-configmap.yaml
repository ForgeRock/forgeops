{{- if and (or .Values.ds_cts.enabled .Values.ds_idrepo.enabled)
    (or .Values.ds_cts.securityContext.readOnlyRootFilesystem .Values.ds_idrepo.securityContext.readOnlyRootFilesystem)}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-init-scripts
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
data:
  {{ (.Files.Glob (printf "%s/ds/init-scripts/**.sh" (include "platform.filesDir" .))).AsConfig | nindent 2 }}
{{- end }}
{{- /* The chart's ds entrypoint is canonical in BOTH image modes since
     FORGEOPS-6971 (one POSIX script tree): the statefulsets mount it over
     the image's baked copy everywhere. COUPLING (explicit contract): a
     base-mode deployment now runs the entrypoint of the CHART version it
     pins, not of the ds image — a chart/image version mismatch means the
     chart's script semantics win. The chart's entrypoint assumes the
     forgeops DS layout (runtime-scripts ConfigMaps, data.tar.gz priming,
     /opt/opendj/env.sh); pin a ds image that ships that layout. subPath
     ConfigMap mounts do NOT live-update: an entrypoint change reaches pods
     on their next rollout (no checksum annotation here by design — every
     entrypoint edit should not roll DS). */}}
{{- if or .Values.ds_cts.enabled .Values.ds_idrepo.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-entrypoint
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
data:
  {{ (.Files.Glob (printf "%s/ds/docker-entrypoint.sh" (include "platform.filesDir" .))).AsConfig | nindent 2 }}
{{- end }}
