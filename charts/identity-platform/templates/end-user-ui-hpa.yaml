{{- /* Values alias: prefer enduser_ui, fall back to the deprecated
     end_user_ui key (see platform.endUserUi in _helpers.tpl). */}}
{{- $eui := .Values.enduser_ui }}
{{- $eui = mustMergeOverwrite (deepCopy $eui) (deepCopy (.Values.end_user_ui | default dict)) }}
{{- if and $eui.enabled $eui.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: end-user-ui
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with $eui.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "identity-platform.fullname" . }}
  minReplicas: {{ $eui.autoscaling.minReplicas }}
  maxReplicas: {{ $eui.autoscaling.maxReplicas }}
  metrics:
    {{- if $eui.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: {{ $eui.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $eui.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        targetAverageUtilization: {{ $eui.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
