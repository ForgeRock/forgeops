{{- if .Values.am.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: am-init-scripts
  labels:
    {{- include "identity-platform.labels" . | nindent 4 }}
    {{- with .Values.am.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{ (.Files.Glob (printf "%s/am/init-scripts/**.sh" (include "platform.filesDir" .))).AsConfig | nindent 2 }}
{{- end }}
