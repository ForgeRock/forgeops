---
mode: server
replicaCount: 1
image:
  repository: us-docker.pkg.dev/forgeops-public/images/rcs
  # The alpine CI line's pingrcs image (platform.imageMode=forgeops equivalent):
  #   repository: us-docker.pkg.dev/forgeops-public/images/alpine/rcs
  #   tag: 1-alpine3.24.2-jre21.0.12.1  (floating <major>-<dims> tier)
  pullPolicy: IfNotPresent
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      # Kubernetes' token is ALL (case-sensitive): "All" is passed through as
      # an unknown capability name and rejected by the container runtime.
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources: {}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Server mode needs the shared rcs-key secret. The chart generates a random
# plaintext password by default (the entrypoint derives the key-hash form;
# IDM's registration config reads the same value out of the secret). The
# generator is upgrade-safe: an existing rcs-key secret is preserved, so
# creating the secret yourself per the README before (or after) install
# also works and the chart keeps your values.
secrets:
  rcs_key:
    generate:
      RCS_KEY_PASSWORD:
        length: 32

custom_properties: []
# - "connectorserver.url=wss://idp.example.com/openicf"
# - "connectorserver.tokenEndpoint=https://idp.example.com/am/oauth2/realms/root/realms/alpha/access_token"

remoteIps: []
#  - "1.2.3.4/32"

logLevels:
  root: "INFO"
  classes:
    org.forgerock.openicf.misc: "INFO"
    org.forgerock.openicf.connectors: "INFO"
    org.identityconnectors: "INFO"
    org.forgerock.openicf.framework: "INFO"
    org.identityconnectors.framework.impl.api.LoggingProxy: "INFO"
    org.identityconnectors.framework.api.operations: "INFO"
    org.forgerock.openicf.common: "INFO"
    org.forgerock.openicf.contract: "INFO"
    org.forgerock.openicf.test: "INFO"
    org.identityconnectors.common: "INFO"
    org.forgerock.openicf.framework.client: "INFO"
    org.forgerock.openicf.framework.async.impl.AbstractLocalOperationProcessor: "INFO"
    org.identityconnectors.framework: "INFO"
    org.identityconnectors.contract: "INFO"
    org.identityconnectors.test: "INFO"
