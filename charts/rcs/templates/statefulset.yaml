apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rcs.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Required pre-K8s-1.34 (the API server rejects the StatefulSet without
  # it), and what gives pods their stable per-pod DNS (rcs-0.<fullname>)
  # that the headless Service and IDM's RCS_CONNECTOR_SERVER_NAME rely on.
  serviceName: {{ include "rcs.fullname" . }}
  selector:
    matchLabels:
      {{- include "rcs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the rendered properties/logback or custom libs
        # change: the entrypoint copies these into /opt/openicf once at
        # init, so a helm upgrade without this annotation would report
        # success while the running pods kept serving the old config.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rcs.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: writeable
          emptyDir: {}
        - name: config
          configMap:
            name: rcs-config
            items:
              - key: PROPERTIES_FILE
                path: ConnectorServer.properties
              - key: LOG_CONFIG
                path: logback.xml
        - name: trusted-ca-vol
          secret:
            secretName: rcs-certs
            # 0444: the runtime uid is 11111 (non-root, no fsGroup set), and
            # secret volumes are owned root:root - 0640 left the PEMs
            # unreadable and keytool silently produced an empty truststore.
            defaultMode: 0444
            optional: true
        - name: lib
          configMap:
            name: rcs-lib
            optional: true
        - name: init-scripts
          configMap:
            name: rcs-init-scripts
            defaultMode: 0755
        - name: scripts
          configMap:
            name: rcs-scripts
            defaultMode: 0755
            optional: true
      initContainers:
        - name: filesystem-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - mountPath: /init-scripts
              name: init-scripts
            - mountPath: /custom_lib
              name: lib
            - mountPath: /writeable
              name: writeable
          command:
            - "/bin/sh"
            - "/init-scripts/filesystem-init.sh"
      containers:
        - name: rcs
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "/bin/sh"
            - "/opt/openicf/bin/docker-entrypoint.sh"
          volumeMounts:
            - name: writeable
              mountPath: /opt/openicf
              subPath: openicf
            - name: config
              mountPath: /opt/openicf/conf
            - name: trusted-ca-vol
              mountPath: /opt/openicf/trusted-cas
            - name: scripts
              mountPath: /opt/openicf/scripts
            - name: writeable
              mountPath: /tmp
              subPath: tmp
          env: 
            {{- if eq .Values.mode "client" }}
            - name: RCS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: rcs-client-auth
                  key: clientId
            - name: RCS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rcs-client-auth
                  key: clientSecret
            {{- else }}
            # RCS_KEY_PASSWORD is the plaintext shared password; the
            # entrypoint derives the key-hash form the connector server
            # wants (base64(sha1(utf-16be(PW)))). IDM's registration config
            # must hold the same plaintext (see charts/identity-platform).
            - name: RCS_KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rcs-key
                  key: RCS_KEY_PASSWORD
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
