apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# HAND-MAINTAINED: bin/base-generate.sh does NOT refresh this directory
# (it has no values.yaml, so the generator never visits it). The two
# ConfigMaps are split out of the chart's multi-resource templates
# (templates/ds-configmap.yaml and templates/ds-runtime-scripts.yaml);
# re-copy their content by hand from the chart when those change:
#   helm template identity-platform charts/identity-platform \
#     --show-only templates/ds-configmap.yaml \
#     --show-only templates/ds-runtime-scripts.yaml
# This base must be included EXACTLY ONCE per build — both DS bases
# (../cts and ../idrepo) mount these ConfigMaps, and including it once
# per DS base would duplicate resource IDs.

resources:
  - ds-entrypoint.yaml
  - ds-runtime-scripts.yaml
