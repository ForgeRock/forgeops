---
# Source: identity-platform/templates/ds-runtime-scripts.yaml (ds-runtime-scripts CM; hand-split into kustomize/base/ds/shared)
# HAND-MAINTAINED: bin/base-generate.sh does NOT refresh this file
# (see ../shared/kustomization.yaml). Split out of the chart's
# multi-resource templates/ds-runtime-scripts.yaml; re-copy its content by hand from the chart
# when the template changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-runtime-scripts
  labels:
    helm.sh/chart: identity-platform-1.0.0
    app.kubernetes.io/name: identity-platform
    app.kubernetes.io/part-of: identity-platform
    app.kubernetes.io/instance: identity-platform
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  init-and-restore.sh: "#!/bin/sh\n# Simple script to automatically restore DS from\
    \ backups\n# Note: This script assumes it runs in a k8s init-container with the\
    \ proper volumes and environment variables attached.\n# Shared by the Debian and\
    \ Alpine image lines: POSIX sh only \u2014\n#   - busybox ls has no GNU \"-I pattern\"\
    \ flag: filter lost+found with grep\n#   - no arrays: DSBACKUP_HOSTS handled via\
    \ word-splitting and a \"case\" membership test\n#   - the disaster-recovery backend\
    \ list is walked with while-read instead of\n#     a bash array with arithmetic\
    \ indexing\n#   - no \"exit -1\" (busybox rejects negative exit codes); no GNU-only\
    \ flags\n\n# Required environment variables:\n# AUTORESTORE_FROM_DSBACKUP: Set\
    \ to true to restore from backup. Defaults to false\n# GOOGLE_CREDENTIALS_JSON:\
    \ Contents of the service account JSON, if using Google Cloud. The SA must have\
    \ write privileges in the desired bucket\n# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY:\
    \ Access key and secret for AWS, if using S3.\n# AZURE_STORAGE_ACCOUNT_NAME, AZURE_ACCOUNT_KEY:\
    \ Storage account name and key, if using Azure\n\n# Copying Google Cloud service\
    \ account in to the credentials cache\nGCP_CREDENTIAL_PATH=\"/var/run/secrets/cloud-credentials-cache/gcp-credentials.json\"\
    \nprintf %s \"$GOOGLE_CREDENTIALS_JSON\" > ${GCP_CREDENTIAL_PATH}\n\nset -e\n\n\
    if [ -n \"$(ls -A /opt/opendj/data | grep -v '^lost+found$')\" ]; then\n  echo\
    \ \"Found data present in /opt/opendj/data before PingDS initialization\"\n  DATA_PRESENT_BEFORE_INIT=\"\
    true\"\n  ls -A /opt/opendj/data | grep -v '^lost+found$'\nfi\n\n# Initialize\
    \ PingDS regardless of dsbackup restore settings\n/opt/opendj/docker-entrypoint.sh\
    \ initialize-only;\n\necho \"\"\nif [ -z \"${AUTORESTORE_FROM_DSBACKUP}\" ] ||\
    \ [ \"${AUTORESTORE_FROM_DSBACKUP}\" != \"true\" ]; then\n    echo \"AUTORESTORE_FROM_DSBACKUP\
    \ is missing or not set to true. Skipping restore\"\n    exit 0\nelse\n    echo\
    \ \"AUTORESTORE_FROM_DSBACKUP is set to true. Will attempt to recover from backup\"\
    \nfi\n\nif [ -z \"${DSBACKUP_DIRECTORY}\" ]; then\n    echo \"If AUTORESTORE_FROM_DSBACKUP\
    \ is enabled, DSBACKUP_DIRECTORY must be specified. \"\n    echo \"DSBACKUP_DIRECTORY\
    \ can be set to: /local/path | s3://bucket/path | az://container/path | gs://bucket/path\
    \ \"\n    exit 1\nelse\n    echo \"DSBACKUP_DIRECTORY is set to $DSBACKUP_DIRECTORY\"\
    \nfi\n\nif [ -z \"${DSBACKUP_HOSTS}\" ]; then\n    echo \"If AUTORESTORE_FROM_DSBACKUP\
    \ is enabled, DSBACKUP_HOSTS must be specified. \"\n    echo \"DSBACKUP_HOSTS\
    \ should contain the pod names. Example: 'ds-cts-0,ds-idrepo-0'\"\n    exit 1\n\
    else\n    echo \"DSBACKUP_HOSTS is set to $DSBACKUP_HOSTS\"\nfi\n\nif [ -n \"\
    ${DATA_PRESENT_BEFORE_INIT}\" ] && [ \"${DATA_PRESENT_BEFORE_INIT}\" != \"false\"\
    \ ]; then\n   echo \"****\"\n   echo \"There's data already present in /opt/opendj/data.\
    \ Skipping restore operation.\"\n   echo \"****\"\n   exit 0\nfi\n\nAWS_PARAMS=\"\
    --storageProperty s3.keyId.env.var:AWS_ACCESS_KEY_ID  --storageProperty s3.secret.env.var:AWS_SECRET_ACCESS_KEY\"\
    \nAZ_PARAMS=\"--storageProperty az.accountName.env.var:AZURE_STORAGE_ACCOUNT_NAME\
    \  --storageProperty az.accountKey.env.var:AZURE_ACCOUNT_KEY --storageProperty\
    \ endpoint:https://${AZURE_STORAGE_ACCOUNT_NAME}.blob.core.windows.net\"\nGCP_PARAMS=\"\
    --storageProperty gs.credentials.path:${GCP_CREDENTIAL_PATH}\"\nEXTRA_PARAMS=\"\
    \"\n\n# Split the comma separated value in $DSBACKUP_HOSTS into a SPACE separated\n\
    # single-line list (busybox ash has no arrays; word splitting in \"for\" does\n\
    # the rest, and the space-joined form is also what the membership test below\n\
    # requires: a NEWLINE-joined list would never match \" ${HOSTNAME} \" because\n\
    # the separators are newlines, not spaces \u2014 the bash original's array\n#\
    \ expansion was space-joined, and tr preserves that).\nHOSTS=$(echo \"${DSBACKUP_HOSTS}\"\
    \ | tr ',' ' ')\n\n\ncase \"$DSBACKUP_DIRECTORY\" in\ns3://* )\n    echo \"S3\
    \ Bucket detected. Restoring backups from AWS S3\"\n    EXTRA_PARAMS=\"${AWS_PARAMS}\"\
    \n    ;;\naz://* )\n    echo \"Azure Bucket detected. Restoring backups from Azure\
    \ block storage\"\n    EXTRA_PARAMS=\"${AZ_PARAMS}\"\n    ;;\ngs://* )\n    echo\
    \ \"Google Cloud Storage Bucket detected. Restoring backups from GCS\"\n    EXTRA_PARAMS=\"\
    ${GCP_PARAMS}\"\n    ;;\n*)\n    echo \"Restoring backups from local storage\"\
    \n    EXTRA_PARAMS=\"\"\n    ;;\nesac\n# Recover from the first available backup\
    \ that passes verification checks.\nfor host in ${HOSTS}; do\n    # Remove the\
    \ pod idx and compare. ex. ds-idrepo-2 => ds-idrepo-\n    # if ds-idrepo- = ds-idrepo-,\
    \ then attemp to restore from that $host backup\n    if [ \"$(printf %s \"${HOSTNAME}\"\
    \ | sed 's/[0-9]\\+$//')\" = \"$(printf %s \"${host}\" | sed 's/[0-9]\\+$//')\"\
    \ ]; then\n        BACKUP_NAME=\"${host}\"\n        BACKUP_LOCATION=\"${DSBACKUP_DIRECTORY}/${BACKUP_NAME}\"\
    \n\n        echo \"Attempting to verify backup from: ${BACKUP_LOCATION}\"\n  \
    \      # If this host owns a backup task, restore the `tasks` backend. Else, skip\
    \ the `tasks` backend.\n        # POSIX replacement for the bash membership test:\
    \ [[ \" $HOSTS \" =~ \" $HOSTNAME \" ]].\n        # (HOSTS is space-joined by\
    \ the tr above, so the delimiters match.)\n        case \" ${HOSTS} \" in\n  \
    \          *\" ${HOSTNAME} \"*)\n                BACKEND_NAMES=$(dsbackup list\
    \ --last --verify --noPropertiesFile --backupLocation ${BACKUP_LOCATION} ${EXTRA_PARAMS}\
    \ |\n                    grep -i \"backend name\" | awk '{printf \"%s %s \",\"\
    --backendName\", $3}')\n                ;;\n            *)\n                BACKEND_NAMES=$(dsbackup\
    \ list --last --verify --noPropertiesFile --backupLocation ${BACKUP_LOCATION}\
    \ ${EXTRA_PARAMS} |\n                    grep -i \"backend name\" | grep -v \"\
    tasks\" | awk '{printf \"%s %s \",\"--backendName\", $3}')\n                ;;\n\
    \        esac\n        if [ ! -z \"${BACKEND_NAMES}\" ]; then\n            # Verification\
    \ complete, we will use $BACKUP_LOCATION for restore\n            break\n    \
    \    fi\n    fi\ndone\n\nif [ -z \"${BACKUP_NAME:-}\" ]; then\n    echo \"No suitable\
    \ backup target was found for $HOSTNAME. Skipping restore\"\n    exit 0\nelse\n\
    \    echo \"BACKUP_NAME is set to $BACKUP_NAME\"\nfi\n\nif [ ! -z \"${BACKEND_NAMES}\"\
    \ ]; then\n    echo \"Verification completed.\"\n    echo\n    echo \"Restoring\
    \ backups from: ${BACKUP_LOCATION}\"\n    echo \"Restoring ${BACKEND_NAMES}\"\n\
    \    dsbackup restore --offline --noPropertiesFile --backupLocation ${BACKUP_LOCATION}\
    \ ${EXTRA_PARAMS} ${BACKEND_NAMES}\n    echo \"Restore operation completed.\"\n\
    \n    run_dr=$(dsrepl --help | awk '/disaster-recovery/ {split($1, cmd, \"-\"\
    ); if (cmd[1] == \"disaster\") print \"true\"}')\n    if [ -n \"${run_dr}\" ];\
    \ then\n        echo\n        echo \"Running disaster recovery with version: ${DISASTER_RECOVERY_ID}\"\
    \n        # BACKEND_NAMES is a \"--backendName <name> --backendName <name> ...\"\
    \ list.\n        # Walk it pairwise (name=the --backendName marker, next token\
    \ = the\n        # backend name itself; busybox ash has no arrays). A `for` over\n\
    \        # word-split output, NOT a piped while-read: the pipe would run the\n\
    \        # loop in a subshell AND leave dsconfig/dsrepl reading the list on\n\
    \        # stdin \u2014 any stdin read inside the loop would consume entries.\n\
    \        # Backend names contain no whitespace, so word splitting is safe.\n \
    \       for backend in $(printf '%s\\n' ${BACKEND_NAMES} | awk 'NR % 2 == 0');\
    \ do\n            [ -z \"$backend\" ] && continue\n            # Clear per iteration:\
    \ a `schema` backend (which skips the\n            # dsconfig lookup) must not\
    \ inherit the PREVIOUS backend's base\n            # DNs and re-run disaster recovery\
    \ on them.\n            basedns=\"\"\n            if ! [ \"${backend}\" = \"schema\"\
    \ ]; then\n                basedns=$(dsconfig get-backend-prop --offline --script-friendly\
    \ --no-prompt --backend-name ${backend} --property base-dn | awk '{print $2}')\n\
    \            fi\n            for basedn in ${basedns:-}; do\n                echo\
    \ \"Running disaster recovery on basedn ${basedn} for backend ${backend}\"\n \
    \               dsrepl disaster-recovery --no-prompt --user-generated-id ${DISASTER_RECOVERY_ID}\
    \ --baseDn \"${basedn}\"\n            done\n        done\n        echo \"Disaster\
    \ recovery completed.\"\n    else\n        echo\n        echo \"Skipping disaster\
    \ recovery because the server does not support local disaster recovery\"\n   \
    \ fi\nelse\n    echo \"No Backup found in ${BACKUP_LOCATION}. There's nothing\
    \ to restore\"\nfi\necho\n"
  schedule-backup.sh: "#!/bin/sh\n\n# The DS scheduled-backup task script, shared\
    \ by the Debian and Alpine image\n# lines.\ncd /opt/opendj\nINCREMENTAL_CRON=${BACKUP_SCHEDULE:-0\
    \ * * * *}\n\n# Set backup location whether locally or to cloud storage. Default:\
    \ /opt/opendj/data/bak\nif [ -z \"${BACKUP_DIRECTORY}\" ]; then\n    echo \"BACKUP_DIRECTORY\
    \ must be specified. \"\n    echo \"BACKUP_DIRECTORY can be set to: /local/path\
    \ | s3://bucket/path | az://container/path | gs://bucket/path \"\n    # (not \"\
    exit -1\": busybox ash rejects negative exit codes)\n    exit 1\nelse\n    echo\
    \ \"BACKUP_DIRECTORY is set to $BACKUP_DIRECTORY\"\nfi\n\n# Get PingDS admin password\n\
    ADMIN_PASSWORD=$(cat ${DS_UID_ADMIN_PASSWORD_FILE})\n\n# Get task name, if task\
    \ with name already running, then cancel\nTASK_NAME=${TASK_NAME:-\"recurringBackupTask\"\
    }\necho \"Cancelling task: ${TASK_NAME} if it exists. Ignore errors if the task\
    \ does not exist\"\nmanage-tasks --cancel \"${TASK_NAME}\" --hostname \"localhost\"\
    \ \\\n    --port 4444 --bindDN \"uid=admin\" \\\n    --bindPassword  \"${ADMIN_PASSWORD}\"\
    \ --trustAll | grep -i \"cancelled\"\n\necho \"Cancelling task operation complete\"\
    \n\n# Exit if request was to cancel task\nif [ -n \"${CANCEL:-}\" ]; then\n  \
    \  exit 0\nfi\n\n# Cloud storage backup properties\nAWS_PARAMS=\"--storageProperty\
    \ s3.keyId.env.var:AWS_ACCESS_KEY_ID  --storageProperty s3.secret.env.var:AWS_SECRET_ACCESS_KEY\
    \ --storageProperty endpoint:https://s3.${AWS_REGION}.amazonaws.com\"\nAZ_PARAMS=\"\
    --storageProperty az.accountName.env.var:AZURE_STORAGE_ACCOUNT_NAME  --storageProperty\
    \ az.accountKey.env.var:AZURE_ACCOUNT_KEY --storageProperty endpoint:https://${AZURE_STORAGE_ACCOUNT_NAME}.blob.core.windows.net\"\
    \nGCP_CREDENTIAL_PATH=\"/var/run/secrets/cloud-credentials-cache/gcp-credentials.json\"\
    \nGCP_PARAMS=\"--storageProperty gs.credentials.path:${GCP_CREDENTIAL_PATH}\"\n\
    BACKUP_LOCATION=\"${BACKUP_DIRECTORY}/${HOSTNAME}\"\n\ncase \"$BACKUP_DIRECTORY\"\
    \ in \n    s3://* )\n        echo \"S3 Bucket detected. Setting up backups in\
    \ AWS S3\"\n        EXTRA_PARAMS=\"${AWS_PARAMS}\"\n        ;;\n    az://* )\n\
    \        echo \"Azure Bucket detected. Setting up backups in Azure block storage\"\
    \n        EXTRA_PARAMS=\"${AZ_PARAMS}\"\n        ;;\n    gs://* )\n        echo\
    \ \"Google Cloud Storage Bucket detected. Setting up backups in Google Cloud Storage\"\
    \n        printf %s \"$GOOGLE_CREDENTIALS_JSON\" > ${GCP_CREDENTIAL_PATH}\n  \
    \      EXTRA_PARAMS=\"${GCP_PARAMS}\"\n        ;;\n    *)\n        EXTRA_PARAMS=\"\
    \"\n        ;;\nesac    \n\n# Add optional backends to dsbackup command\nif [\
    \ -n \"${BACKENDS}\" ]; then\n    # busybox ash has no arrays: split BACKENDS\
    \ by comma into a\n    # space-separated list and word-split it in the for loop.\n\
    \    backends=$(echo \"$BACKENDS\" | awk '{split($0,arr,\",\")} {for (i in arr)\
    \ {print arr[i]}}')\n    # Loop through backends and carry out dsbackup task\n\
    \    for backend in ${backends}\n    do\n        EXTRA_PARAMS=\"${EXTRA_PARAMS}\
    \ --backendName ${backend}\"\n    done\nfi\n\necho \"Storing backups in ${BACKUP_LOCATION}\"\
    \n\ndsbackup create \\\n    --hostname localhost \\\n    --port 4444 \\\n    --bindDN\
    \ uid=admin \\\n    --bindPassword \"${ADMIN_PASSWORD}\" \\\n    --backupLocation\
    \ \"${BACKUP_LOCATION}\" \\\n    --recurringTask \"${INCREMENTAL_CRON}\" \\\n\
    \    --taskId \"${TASK_NAME}\" \\\n    --trustAll \\\n    $EXTRA_PARAMS\n"
  rstatus: "#!/bin/sh\n. /opt/opendj/env.sh\n\n\necho \"DS Status\"\nstatus --hostname\
    \ localhost --port 4444 \\\n    --bindDN uid=admin --bindPassword:file $DS_UID_ADMIN_PASSWORD_FILE\
    \ \\\n    --trustAll\n\necho \"Replication Status\"\n\n dsrepl status --hostname\
    \ localhost  --port 4444 \\\n    --bindDN uid=admin --bindPassword:file $DS_UID_ADMIN_PASSWORD_FILE\
    \ \\\n    --trustAll \\\n    --showReplicas --showGroups --showChangeLogs\n"
  support: '#!/bin/sh

    # Create a support extract


    supportextract  --bindDN "uid=admin" --bindPassword $(cat $DS_UID_ADMIN_PASSWORD_FILE)
    --outputDirectory $DS_DATA_DIR/support-extract'
