---
# Source: identity-platform/templates/idm-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: idm
  labels:
    helm.sh/chart: identity-platform-1.0.0
    app.kubernetes.io/name: identity-platform
    app.kubernetes.io/part-of: identity-platform
    app.kubernetes.io/instance: identity-platform
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app: idm
    app.kubernetes.io/component: idm
data:
  IDM_ENVCONFIG_DIRS: /opt/openidm/resolver
  LOGGING_PROPERTIES: /var/run/openidm/logging/logback/logback.xml
  OPENIDM_ANONYMOUS_PASSWORD: anonymous
  OPENIDM_CLUSTER_REMOVE_OFFLINE_NODE_STATE: "true"
  OPENIDM_CONFIG_REPO_ENABLED: "false"
  PROJECT_HOME: /opt/openidm
  OPENIDM_ICF_RETRY_DELAYSECONDS: "10"
  OPENIDM_ICF_RETRY_MAXRETRIES: "12"
  OPENIDM_AUDIT_HANDLER_JSON_ENABLED: "false"
  OPENIDM_AUDIT_HANDLER_STDOUT_ENABLED: "true"
---
# Source: identity-platform/templates/idm-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: idm-logback-xml
  labels:
    helm.sh/chart: identity-platform-1.0.0
    app.kubernetes.io/name: identity-platform
    app.kubernetes.io/part-of: identity-platform
    app.kubernetes.io/instance: identity-platform
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app: idm
    app.kubernetes.io/component: idm
data:
  
  logback.xml: |
    <configuration scan="true" scanPeriod="30 seconds">
        <import class="ch.qos.logback.core.status.NopStatusListener"/>
        <import class="ch.qos.logback.core.rolling.RollingFileAppender"/>
        <import class="ch.qos.logback.core.rolling.SizeAndTimeBasedRollingPolicy"/>
        <import class="ch.qos.logback.core.rolling.TimeBasedRollingPolicy"/>
        <import class="ch.qos.logback.core.ConsoleAppender"/>
        <import class="ch.qos.logback.classic.filter.ThresholdFilter"/>
        <import class="ch.qos.logback.classic.encoder.JsonEncoder"/>
        <import class="ch.qos.logback.classic.encoder.PatternLayoutEncoder"/>
        <import class="ch.qos.logback.classic.jul.LevelChangePropagator"/>
  
        <contextListener class="LevelChangePropagator"/>
        <conversionRule conversionWord="threadId" converterClass="org.forgerock.openidm.logger.ThreadIdConverter"/>
        <conversionRule conversionWord="julLevel"
                        converterClass="org.forgerock.openidm.logger.LogbackToJulLevelConverter"/>
  
        <statusListener class="NopStatusListener"/>
  
        <appender name="file" class="RollingFileAppender">
            <file>logs/openidm.log</file>
  
            <!-- deny all events with a level below DEBUG, that is TRACE -->
            <filter class="ThresholdFilter">
                <level>TRACE</level>
            </filter>
  
            <filter class="org.forgerock.openidm.logger.LogbackLogFilter"/>
  
            <rollingPolicy class="TimeBasedRollingPolicy">
                <fileNamePattern>logs/openidm-%d{yyyy-MM-dd}.log</fileNamePattern>
                <maxHistory>30</maxHistory>
                <totalSizeCap>1GB</totalSizeCap>
            </rollingPolicy>
  
            <!--
            The PatternLayoutEncoder emulates IDM's legacy java.util.logging string format. Uncomment the following
            PatternLayoutEncoder encoder and comment out the JsonEncoder to implement the legacy string format.
            -->
            <!--
            <encoder class="PatternLayoutEncoder">
                <charset>UTF-8</charset>
                <pattern>[%threadId] %date{"MMM dd, yyyy h:mm:ss.SSS a"} %class %method%n%julLevel: %replace(%msg){'[\r\n]+',''}%ex%n</pattern>
            </encoder>
            -->
  
            <encoder class="JsonEncoder">
                <withFormattedMessage>true</withFormattedMessage>
                <withMessage>false</withMessage>
                <withArguments>false</withArguments>
                <withNanoseconds>false</withNanoseconds>
                <withSequenceNumber>false</withSequenceNumber>
            </encoder>
  
        </appender>
  
        <appender name="console" class="ConsoleAppender">
            <!-- deny all events with a level below INFO, that is TRACE and DEBUG -->
            <filter class="ThresholdFilter">
                <level>INFO</level>
            </filter>
  
            <filter class="org.forgerock.openidm.logger.LogbackLogFilter"/>
  
            <!--
            The PatternLayoutEncoder emulates IDM's legacy java.util.logging string format. Uncomment the following
            PatternLayoutEncoder encoder and comment out the JsonEncoder to implement the legacy string format.
            -->
            <!--
            <encoder class="PatternLayoutEncoder">
                <charset>UTF-8</charset>
                <pattern>[%threadId] %date{"MMM dd, yyyy h:mm:ss.SSS a"} %class %method%n%julLevel: %replace(%msg){'[\r\n]+',''}%ex%n</pattern>
            </encoder>
            -->
  
            <encoder class="JsonEncoder">
                <withFormattedMessage>true</withFormattedMessage>
                <withMessage>false</withMessage>
                <withArguments>false</withArguments>
                <withNanoseconds>false</withNanoseconds>
                <withSequenceNumber>false</withSequenceNumber>
            </encoder>
  
        </appender>
  
        <!--
         Default root logging level.
         This specifies which kinds of events are logged across all loggers.
         For any given facility this root level can be overridden by a facility specific level.
         Note that the ConsoleHandler also has a separate level setting to limit messages printed to the console.
         Loggers and Handlers may override this level
         -->
  
        <root level="INFO">
            <appender-ref ref="console"/>
            <appender-ref ref="file"/>
        </root>
  
        <!--
        Loggers
        ***********************************************
        Loggers are usually attached to packages.
        Here, the level for each package is specified.
        The global log level is used by default, so levels
        specified here simply act as an override.
        The levels in descending order are:
            ERROR
            WARN
            INFO
            DEBUG
            TRACE
        -->
  
        <!-- The following section sets logging to WARN level & above in certain packages/classes to filter out noise -->
  
        <!--
         Facility specific properties.
         Provides extra control for each logger.
         -->
  
        <!-- <logger name="org.forgerock.openidm.provisioner" level="DEBUG" /> -->
        <!-- <logger name="org.forgerock.openidm.repo" level="DEBUG" /> -->
        <!-- <logger name="org.forgerock.openidm.recon" level="DEBUG" /> -->
  
        <!-- OpenICF is noisy at INFO leve -->
        <logger name="org.forgerock.openicf" level="WARN"/>
  
        <!-- OpenICF Connector Logging -->
        <!-- <logger name="org.identityconnectors" level="DEBUG" /> -->
        <!-- <logger name="org.forgerock.openicf.connectors" level="DEBUG" /> -->
  
        <!-- OpenICF Framework API Logging -->
        <!-- <logger name="org.identityconnectors.framework.impl.api.LoggingProxy" level="DEBUG" /> -->
        <!-- <logger name="org.identityconnectors.framework.api.operations" level="DEBUG" /> -->
        <!-- <logger name="org.identityconnectors.framework.api.operations.GetApiOp" level="DEBUG" /> -->
        <!-- <logger name="org.identityconnectors.framework.api.operations.CreateApiOp" level="DEBUG" /> -->
        <!-- <logger name="org.identityconnectors.framework.api.operations.UpdateApiOp" level="DEBUG" /> -->
        <!-- <logger name="org.identityconnectors.framework.api.operations.DeleteApiOp" level="DEBUG" /> -->
        <!-- <logger name="org.identityconnectors.framework.api.operations.SearchApiOp" level="DEBUG" /> -->
  
        <!-- Commons api.models and OpenApiTransformer (API Descriptor) is noisy at INFO level -->
        <logger name="org.forgerock.api.models" level="WARN"/>
        <logger name="org.forgerock.api.transform.OpenApiTransformer" level="WARN"/>
  
        <!-- Logs the output from OSGi logging -->
        <logger name="org.forgerock.openidm.Framework" level="WARN"/>
  
        <!-- On restart the BarURLHandler can create warning noise -->
        <logger name="org.activiti.osgi.BarURLHandler" level="ERROR"/>
  
        <!-- Suppress warnings of failed connector loading -->
        <logger name="org.identityconnectors.framework.impl.api.local.LocalConnectorInfoManagerImpl" level="ERROR"/>
  
        <!-- Log all detail for update processes -->
        <logger name="org.forgerock.openidm.maintenance.upgrade" level="TRACE"/>
  
        <!-- Suppress messages lower than warnings -->
        <logger name="org.forgerock.secrets.keystore" level="WARN"/>
  
        <!--
        Sets the SchemaField log level to INFO by default because if logging is set to FINE or higher,
        sensitive information can be leaked into the logs
         -->
        <logger name="org.forgerock.openidm.schema.SchemaField" level="INFO"/>
  
        <!--
        Logs the output from Jetty
        Sets the following Jetty classes to INFO level by default because if logging is set to FINE or higher,
        sensitive information can be leaked into the logs
         -->
        <logger name="org.eclipse.jetty" level="WARN"/>
        <logger name="org.eclipse.jetty.websocket.server" level="WARN"/>
  
        <!-- Mute intermittent `Error page loop` warning, which does not indicate a real problem -->
        <logger name="org.eclipse.jetty.server.handler.ErrorHandler" level="ERROR"/>
  
        <!-- Log Hikari datasource in case we need to debug secret rotation failures -->
        <logger name="com.zaxxer.hikari.pool.HikariPool" level="DEBUG"/>
        <logger name="com.zaxxer.hikari.pool.PoolBase" level="DEBUG"/>
  
        <!-- Testcontainers log suppressions to reduce verbosity of logs to the osgi console -->
        <logger name="org.testcontainers.containers.ContainerDef" level="ERROR"/>
        <logger name="org.testcontainers.utility.ResourceReaper" level="ERROR"/>
  
    </configuration>
---
# Source: identity-platform/templates/idm-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: idm-logging-properties
  labels:
    helm.sh/chart: identity-platform-1.0.0
    app.kubernetes.io/name: identity-platform
    app.kubernetes.io/part-of: identity-platform
    app.kubernetes.io/instance: identity-platform
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app: idm
    app.kubernetes.io/component: idm
data:
  
  logging.properties: |
    # Properties file that configures the operation of the JDK
    # logging facility.
    # The system will look for this configuration file, first using
    # a System property specified at startup:
    #
    # >java -Djava.util.logging.config.file=myLoggingConfigFilePath
    #
    # If this property is not specified, then the configuration file is
    # retrieved from its default location at:
    #
    # JDK_HOME/jre/lib/logging.properties
    ############################################################
    #      Global properties
    ############################################################
    # ------------------------------------------
    # The set of handlers to be loaded upon startup.
    # Comma-separated list of class names.
    # (? LogManager docs say no comma here, but JDK example has comma.)
    # StreamHandler: A simple handler for writing formatted records to an OutputStream.
    # ConsoleHandler: A simple handler for writing formatted records to System.err
    # FileHandler: A handler that writes formatted log records either to a single file, or to a set of rotating log files.
    # SocketHandler: A handler that writes formatted log records to remote TCP ports.
    # MemoryHandler: A handler that buffers log records in memory.
    # handlers=java.util.logging.ConsoleHandler
    # handlers=java.util.logging.FileHandler, java.util.logging.ConsoleHandler
    # For Docker, write everything to the console
    handlers=java.util.logging.ConsoleHandler
    # Default global logging level.
    # This specifies which kinds of events are logged across
    # all loggers.  For any given facility this global level
    # can be overriden by a facility specific level
    # Note that the ConsoleHandler also has a separate level
    # setting to limit messages printed to the console.
    # Loggers and Handlers may override this level
    .level=INFO
    # Loggers
    # ------------------------------------------
    # Loggers are usually attached to packages.
    # Here, the level for each package is specified.
    # The global level is used by default, so levels
    # specified here simply act as an override.
    # The levels in descending order are:
    #   SEVERE (highest value)
    #   WARNING
    #   INFO
    #   CONFIG
    #   FINE
    #   FINER
    #   FINEST (lowest value)
    ############################################################
    # Facility specific properties.
    # Provides extra control for each logger.
    ############################################################
    #org.forgerock.openidm.provisioner.level = FINER
    #org.forgerock.openidm.repo.level = FINER
    #org.forgerock.openidm.recon.level = FINER
    # OpenICF is noisy at INFO level
    org.forgerock.openicf.level=WARNING
    # Logs the output from OSGi logging
    org.forgerock.openidm.Framework.level=WARNING
    # On restart the BarURLHandler can create warning noise
    org.activiti.osgi.BarURLHandler.level=SEVERE
    # Suppress warnings of failed connector loading
    org.identityconnectors.framework.impl.api.local.LocalConnectorInfoManagerImpl.level=SEVERE
    ############################################################
    # Handler specific properties.
    # Describes specific configuration info for Handlers.
    ############################################################
    # --- ConsoleHandler ---
    # Default: java.util.logging.ConsoleHandler.level = INFO
    # Override of global logging level
    #java.util.logging.ConsoleHandler.level = WARNING
    # For Docker
    java.util.logging.ConsoleHandler.level = INFO
    java.util.logging.ConsoleHandler.formatter = org.forgerock.openidm.logger.SanitizedThreadIdLogFormatter
    # specifies the name of the filter class to be associated with this handler,
    # defaults to {@code null} if this property is not found or has an invalid value.
    java.util.logging.ConsoleHandler.filter=org.forgerock.openidm.logging.util.LogFilter
    # --- FileHandler ---
    # Override of global logging level
    java.util.logging.FileHandler.level = ALL
    # Naming style for the output file:
    # (The output file is placed in the directory
    # defined by the "user.home" System property.)
    # java.util.logging.FileHandler.pattern = %h/java%u.log
    java.util.logging.FileHandler.pattern = logs/openidm%u.log
    # Limiting size of output file in bytes:
    java.util.logging.FileHandler.limit = 5242880
    # Number of output files to cycle through, by appending an
    # integer to the base file name:
    java.util.logging.FileHandler.count = 5
    # Style of output (Simple or XML):
    # Writes brief "human-readable" summaries of log records.
    java.util.logging.FileHandler.formatter = org.forgerock.openidm.logger.SanitizedThreadIdLogFormatter
    # Writes detailed XML-structured information.
    # java.util.logging.FileHandler.formatter = java.util.logging.XMLFormatter
    # specifies the character set encoding name.
    # defaults to the default platform encoding
    java.util.logging.FileHandler.encoding = UTF-8
---
# Source: identity-platform/templates/idm-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: idm-init-scripts
  labels:
    helm.sh/chart: identity-platform-1.0.0
    app.kubernetes.io/name: identity-platform
    app.kubernetes.io/part-of: identity-platform
    app.kubernetes.io/instance: identity-platform
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app: idm
    app.kubernetes.io/component: idm
data:
  
  custom-vol-init.sh: |
    #!/bin/sh
  
    if [ -d /custom/config ]; then
        echo "Existing openidm configuration found in /custom. Skipping copy."
    elif [ "$(ls -A /config)" ]; then
        echo "Copying configuration files to the custom volume."
        mkdir -p /custom/config
        cp -rv /config/* /custom/config/
        ls -F /custom
    else
        echo "No custom FBC found. Continuing with defaults."
    fi
  filesystem-init.sh: |
    #!/bin/sh
  
    if [ -d /fbc/conf ]; then
      echo "Existing openidm configuration found. Skipping copy."
    elif [ -d /custom/config ]; then
      echo "Found config in custom volume."
      cd /opt/openidm
      cp -rv ui conf script /fbc
      # Deployer-provided configuration wins: drop the pristine-conf marker so
      # the image's apply-config-profile.sh never overlays the profile on top.
      # The custom content is a WHOLESALE config replacement — a partial config
      # (one stray file) leaves the conf as the pristine maven-build zip conf,
      # whose repo.ds.json points at localhost. Warn loudly when the custom
      # content does not look like a complete configuration; the profile
      # suppression below is still by design and untouched.
      rm -f /fbc/conf/.pristine-zip-conf
      # -dR not -a: -a implies -p (preserve ownership), which busybox cp cannot
      # honor as a non-root uid and warns per file; see the -dR note below.
      cp -dRv /custom/config/* /fbc/
      if [ ! -f /fbc/conf/repo.ds.json ]; then
        echo "WARNING: the custom config does not include repo.ds.json, so this" >&2
        echo "WARNING: does not look like a complete IDM configuration. The" >&2
        echo "WARNING: CONFIG_PROFILE (cdk-base) overlay is suppressed for custom" >&2
        echo "WARNING: configs by design; IDM may fail to reach its repository." >&2
      fi
    else
      echo "Copying docker image configuration files to the shared volume"
      cd /opt/openidm
      cp -rv ui conf script /fbc
    fi
  
    # Single-image runtime mode: when the deployment runs the image in forgeops
    # mode, apply the CONFIG_PROFILE deployment conf over the conf the main
    # container will read (the fbc volume). Pass /fbc as the home so the overlay
    # lands in /fbc/conf; the helper is a no-op unless IMAGE_MODE=forgeops and
    # the conf is still the pristine maven-build conf. The standalone (no fbc
    # volume) path is covered by the image entrypoint calling the same helper
    # with the default home. The helper ships only in the alpine pingidm image
    # (the Debian image has no CONFIG_PROFILE machinery), so guard on it being
    # present+executable — the || true alone would leave a "not found" on the
    # Debian path's stderr.
    if [ -d /fbc ] && [ -x /opt/openidm/bin/apply-config-profile.sh ]; then
      /opt/openidm/bin/apply-config-profile.sh /fbc || true
    fi
  
    # Out-of-the-box Remote Connector Server (RCS) wiring: when the platform.rcs
    # values enable it AND the rcs-key secret is mounted (its presence means the
    # charts/rcs release is deployed in this namespace), register the RCS with
    # IDM's connector info provider by writing the pid-named conf file. The file
    # is re-written on every boot so a changed key/host is picked up; when the
    # secret is absent nothing is written and IDM keeps its defaults. The
    # secret's RCS_KEY_PASSWORD is the plaintext shared password — what IDM's
    # "key" config field must hold (IDM sends it as the Basic-auth password and
    # the RCS compares its sha1-b64 hash). It is config-encrypted at conf load,
    # so the plaintext copy lives only inside the init-time volume.
    if [ "${RCS_CONNECTOR_SERVER_ENABLED:-false}" = "true" ] \
       && [ -s /rcs-secrets/RCS_KEY_PASSWORD ] && [ -d /fbc/conf ]; then
      RCS_HOST="${RCS_CONNECTOR_SERVER_HOST:-rcs.${NAMESPACE}.svc.cluster.local}"
      RCS_PORT="${RCS_CONNECTOR_SERVER_PORT:-8759}"
      RCS_NAME="${RCS_CONNECTOR_SERVER_NAME:-rcs-0}"
      RCS_USE_SSL="${RCS_CONNECTOR_SERVER_USE_SSL:-false}"
      RCS_KEY=$(cat /rcs-secrets/RCS_KEY_PASSWORD)
      # Escape for JSON interpolation below: a password containing " or \
      # would otherwise produce a malformed conf file and fail IDM's config
      # load with an opaque parse error.
      RCS_KEY=$(printf '%s' "$RCS_KEY" | sed 's/[\\"]/\\&/g')
      printf '%s\n' \
    '{' \
    '  "connectorsLocation": "connectors",' \
    '  "remoteConnectorServers": [' \
    '    {' \
    '      "name": "'"$RCS_NAME"'",' \
    '      "enabled": true,' \
    '      "host": "'"$RCS_HOST"'",' \
    '      "port": '"$RCS_PORT"',' \
    '      "useSSL": '"$RCS_USE_SSL"',' \
    '      "principal": "anonymous",' \
    '      "websocketPath": "openicf",' \
    '      "timeout": 0,' \
    '      "key": "'"$RCS_KEY"'"' \
    '    }' \
    '  ]' \
    '}' > /fbc/conf/org.forgerock.openidm.provisioner.openicf.connectorinfoprovider.json
      echo "Registered Remote Connector Server '$RCS_NAME' at $RCS_HOST:$RCS_PORT"
      # Optional sample provisioner: an LDAP connector over the RCS targeting the
      # deployment's own DS idrepo (resolver props userstore.host / port /
      # basecontext, USERSTORE_PASSWORD from the ds-passwords secret). Gives the
      # admin UI a working Connectors page entry and a base for sync setup.
      if [ "${RCS_CONNECTOR_SERVER_PROVISIONER_ENABLED:-false}" = "true" ]; then
        RCS_PROV_NAME="${RCS_CONNECTOR_SERVER_PROVISIONER_NAME:-ds_ldap}"
        RCS_PROV_HOST="${RCS_CONNECTOR_SERVER_PROVISIONER_HOST:-&{userstore.host|ds-idrepo-0.ds-idrepo}}"
        RCS_PROV_PORT="${RCS_CONNECTOR_SERVER_PROVISIONER_PORT:-1636}"
        RCS_PROV_BASE="${RCS_CONNECTOR_SERVER_PROVISIONER_BASE:-&{userstore.basecontext|ou=identities}}"
        RCS_PROV_USER="${RCS_CONNECTOR_SERVER_PROVISIONER_USER:-&{userstore.user|uid=admin}}"
        printf '%s\n' \
    '{' \
    '  "enabled": true,' \
    '  "connectorRef": {' \
    '    "bundleName": "org.forgerock.openicf.connectors.ldap-connector",' \
    '    "bundleVersion": "[1.5.0.0,1.6.0.0)",' \
    '    "connectorName": "org.identityconnectors.ldap.LdapConnector",' \
    '    "connectorHostRef": "'"$RCS_NAME"'"' \
    '  },' \
    '  "producerBufferSize": 100,' \
    '  "connectorPoolingSupported": true,' \
    '  "poolConfigOption": {' \
    '    "maxObjects": 10,' \
    '    "maxIdle": 10,' \
    '    "maxWait": 150000,' \
    '    "minEvictableIdleTimeMillis": 120000,' \
    '    "minIdle": 1' \
    '  },' \
    '  "operationTimeout": {' \
    '    "CREATE": -1,' \
    '    "TEST": -1,' \
    '    "SYNC": -1,' \
    '    "SEARCH": -1' \
    '  },' \
    '  "configurationProperties": {' \
    '    "principal": "'"$RCS_PROV_USER"'",' \
    '    "credentials": "&{userstore.password|}",' \
    '    "host": "'"$RCS_PROV_HOST"'",' \
    '    "port": {"$int": "'"$RCS_PROV_PORT"'"},' \
    '    "ssl": true,' \
    '    "baseContexts": [' \
    '      "'"$RCS_PROV_BASE"'"' \
    '    ],' \
    '    "uidAttribute": "entryUUID",' \
    '    "readSchema": true,' \
    '    "accountObjectClasses": [' \
    '      "top",' \
    '      "person",' \
    '      "organizationalPerson",' \
    '      "inetOrgPerson"' \
    '    ],' \
    '    "accountUserNameAttributes": [' \
    '      "uid",' \
    '      "cn",' \
    '      "sAMAccountName"' \
    '    ],' \
    '    "passwordAttribute": "userPassword",' \
    '    "useBlocks": true,' \
    '    "blockSize": 100,' \
    '    "usePagedResultControl": true' \
    '  },' \
    '  "objectTypes": {' \
    '    "account": {' \
    '      "id": "account",' \
    '      "type": "object",' \
    '      "nativeType": "__ACCOUNT__",' \
    '      "properties": {' \
    '        "dn": {"type": "string", "required": true, "nativeName": "__NAME__", "nativeType": "string"},' \
    '        "uid": {"type": "string", "nativeName": "uid", "nativeType": "string"},' \
    '        "cn": {"type": "string", "nativeName": "cn", "nativeType": "string"},' \
    '        "sn": {"type": "string", "nativeName": "sn", "nativeType": "string"},' \
    '        "mail": {"type": "string", "nativeName": "mail", "nativeType": "string"},' \
    '        "objectClass": {"type": "array", "items": {"type": "string", "nativeType": "string"}, "nativeName": "objectClass", "nativeType": "string"}' \
    '      }' \
    '    }' \
    '  },' \
    '  "resultsHandlerConfig": {"enableAttributesToGetSearchResultsHandler": true},' \
    '  "syncFailureHandler": {"maxRetries": 5, "postRetryAction": "logged-ignore"}' \
    '}' > "/fbc/conf/provisioner.openicf-${RCS_PROV_NAME}.json"
        echo "Wrote sample LDAP provisioner conf 'provisioner.openicf-${RCS_PROV_NAME}.json' (via RCS $RCS_NAME)"
      fi
    else
      # A stale registration file would keep pointing IDM at a (possibly
      # removed/rotated) RCS: remove it when the wiring is disabled or the
      # secret is gone. Only touch the files this script writes - a deployer
      # who ships their own connectorinfoprovider.json in /custom/config just
      # had it copied to /fbc/conf, and must not lose it to our cleanup.
      if [ ! -e /custom/config/org.forgerock.openidm.provisioner.openicf.connectorinfoprovider.json ]; then
        rm -f /fbc/conf/org.forgerock.openidm.provisioner.openicf.connectorinfoprovider.json 2>/dev/null || true
      fi
      if [ ! -e /custom/config/provisioner.openicf-"${RCS_PROV_NAME:-ds_ldap}".json ]; then
        rm -f /fbc/conf/provisioner.openicf-"${RCS_PROV_NAME:-ds_ldap}".json 2>/dev/null || true
      fi
    fi
  
    echo "Setting up writeable volume."
    echo "Creating tmp"
    mkdir -p /writeable/tmp
    echo "Copying /opt/openidm"
    mkdir -p /writeable/opt
    # `cp -dRv` (NOT -a): -a implies -p (preserve mode/ownership), which busybox
    # cp cannot honor as the init's non-root uid and warns per file ("can't
    # preserve ownership") — noise on every boot. -d/-P (preserve symlinks) is
    # already busybox's default with -R, but stating it keeps GNU cp — where the
    # default depends on build config — behaving identically. -R recurses; both
    # busybox cp and GNU cp support the -dR pair.
    cp -dRv /opt/openidm/ /writeable/opt/openidm
